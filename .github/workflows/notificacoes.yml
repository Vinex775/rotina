
Notificacoes · YML
name: Notificações do Rotina
 
on:
  # Roda sozinho a cada 15 minutos. Ajuste o "*/15" se quiser outro intervalo
  # (ex: "*/5" = a cada 5 min). O horário do cron é sempre em UTC.
  schedule:
    - cron: "*/15 * * * *"
  # Permite clicar em "Run workflow" na aba Actions e rodar na hora, pra testar
  workflow_dispatch:
 
jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
 
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Instalar a biblioteca firebase-admin
        run: npm install firebase-admin
 
      - name: Rodar o script de notificações
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: node scripts/notificar.js

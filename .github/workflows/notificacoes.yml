name: Notificações do Rotina

on:
  # O agendamento agora é feito por um Cloudflare Worker (mais pontual que o
  # "schedule" nativo do GitHub Actions), que chama este workflow por aqui:
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar a biblioteca firebase-admin
        run: npm install firebase-admin

      - name: Rodar o script de notificações
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: node scripts/notificar.js

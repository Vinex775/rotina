// ============================================================
// FIREBASE: importado direto por link (CDN), sem precisar de
// npm/Node.js. Isso é possível porque o SDK v9+ do Firebase é

import {

  isApplyingRemoteData, salvarModo, migrarDadosAntigosSeNecessario,
  comecarAEscutarDados, pararDeEscutar, manutencaoLiberada
} from './sync.js';
import { abrirPainelDeVoz } from './voz.js';


// ---------- Estado do app (igual antes) ----------
let tasks = [];
let selectedFreq = 'daily';
let diasSelecionados = new Set([0,1,2,3,4,5,6]); // formulário de nova tarefa: começa com todos os dias
let expandedTaskId = null;
let subtasksOpenId = null; // controla só a visibilidade dos mini-passos ao clicar na tarefa mãe (separado do "editar")
let focarCampoDeNomeAoAbrir = false; // liga só no instante em que "editar" é clicado
let editingSubtaskId = null; // qual mini-passo está com o texto em edição no momento
let focarSubtaskAoEditar = false; // liga só no instante em que se clica pra editar um passo
let selectedCategory = 'all';
let currentMode = 'ambos';

// O sync.js não pode mudar essas variáveis direto (são daqui), então ele
// chama estas pequenas funções, que fazem a troca por ele.
function setTasks(lista){ tasks = lista; }
function setBlocos(lista){ blocos = lista; }
function setEventos(lista){ eventos = lista; }
function setCurrentMode(modo){ currentMode = modo; }

function renderModeBar(){

function renderViewBar(){

function renderMetaBar(){

    b.classList.toggle('active', b.dataset.showblocked === String(showBlocked));

}

function distinctCategories(){
  const set = new Set(tasks.map(t => t.category || 'Geral'));
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function renderCatBar(){

  cats.forEach(cat => {

function pad(n){ return String(n).padStart(2,'0'); }
function dailyKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function weeklyKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const fDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7*86400000));
  return date.getUTCFullYear()+'-W'+pad(week);
}

function monthlyKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }

function currentKey(freq){
  const d = new Date();
  if(freq === 'daily') return dailyKey(d);
  if(freq === 'weekly') return weeklyKey(d);
  if(freq === 'monthly') return monthlyKey(d);
  return dailyKey(d);
}

function isDone(task){
  if(task.subtasks && task.subtasks.length > 0){
    return task.subtasks.every(s => s.done);
  }
  return task.doneKey === currentKey(task.freq);
}

function cleanupOnceTasks(){
  const today = dailyKey(new Date());
  const idsParaApagar = [];
  tasks = tasks.filter(t => {
    const expirou = t.freq === 'once' && t.doneKey && t.doneKey !== today;
    if(expirou) idsParaApagar.push(t.id);
    return !expirou;
  });
  return idsParaApagar;
}

// Dado um dailyKey ("2026-09-14"), devolve o dia da semana dele (0=domingo).
// Usado pra saber se uma tarefa diária com dias customizados (ex: academia,
// só de segunda a sábado) realmente "valia" naquele dia específico.
function weekdayFromDailyKey(key){
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

// Uma tarefa diária só é "esperada" num dia se esse dia estiver na lista de
// dias ativos dela. task.diasAtivos === null/undefined significa "todo dia"
// (comportamento original, continua valendo pras tarefas já existentes).
function diaEhAtivoParaTarefa(task, diaDaSemana){
  if(task.freq !== 'daily' || !task.diasAtivos) return true;
  return task.diasAtivos.includes(diaDaSemana);
}

// Marca como "atrasada" (missed) uma tarefa recorrente que virou a
// página do período (dia/semana/mês) sem ter sido concluída.
// IMPORTANTE: isso precisa rodar ANTES do resetExpiredPipelines(), porque
// aquela função zera o doneKey/subtasks do novo ciclo — e é justamente o
// doneKey do ciclo que ACABOU que usamos aqui pra saber se deu tempo ou não.
function checkMissedTasks(){
  const tarefasAlteradas = [];
  tasks.forEach(task => {
    if(task.freq === 'once') return; // tarefa única não tem "período" pra atrasar

    const key = currentKey(task.freq);

    if(task.lastEvaluatedKey === undefined){
      // primeira vez que vemos essa tarefa: só começa a contar a partir de agora,
      // pra não acusar atraso de um período que nem existia quando o app rodou essa checagem pela 1ª vez
      task.lastEvaluatedKey = key;
      tarefasAlteradas.push(task);
      return;
    }

    if(task.lastEvaluatedKey !== key){
      // o período anterior (task.lastEvaluatedKey) já terminou — mas só conta
      // como "perdido" se aquele dia era mesmo um dia em que a tarefa valia
      // (ex: não acusa academia de domingo, se domingo não está nos dias ativos)
      const diaAnteriorEraAtivo = task.freq !== 'daily'
        || diaEhAtivoParaTarefa(task, weekdayFromDailyKey(task.lastEvaluatedKey));

      if(diaAnteriorEraAtivo){
        const foiCumpridaNoPeriodoAnterior = task.doneKey === task.lastEvaluatedKey;
        if(!foiCumpridaNoPeriodoAnterior){
          task.missed = true;
        }
      }
      task.lastEvaluatedKey = key;
      tarefasAlteradas.push(task);
    }
  });
  return tarefasAlteradas;
}

// Tarefas recorrentes com mini-passos OU com meta: quando o período muda
// (ex: virou o mês), tanto os passos quanto o progresso da meta precisam
// reiniciar do zero, senão ficariam "colados" pra sempre no ciclo antigo.
function resetExpiredPipelines(){
  const tarefasAlteradas = [];
  tasks.forEach(task => {
    const temAlgoPraResetar = (task.subtasks && task.subtasks.length > 0) || task.meta;
    if(temAlgoPraResetar && task.freq !== 'once'){
      const key = currentKey(task.freq);
      if(task.cycleKey && task.cycleKey !== key){
        if(task.subtasks) task.subtasks.forEach(s => { s.done = false; });
        if(task.meta) task.meta.atual = 0;
        task.doneKey = null;
        task.cycleKey = key;
        tarefasAlteradas.push(task);
      }
    }
  });
  return tarefasAlteradas;
}

// Uma tarefa com meta só pode ser concluída depois que "atual" bate "alvo".
// Tarefas sem meta nenhuma sempre passam nessa checagem.
function metaAtingida(task){
  return !task.meta || task.meta.atual >= task.meta.alvo;
}

function atualizarMeta(taskId, novoValor){
  const task = tasks.find(t => t.id === taskId);
  if(!task || !task.meta) return;
  const valor = Number(novoValor);
  task.meta.atual = isNaN(valor) ? 0 : Math.max(0, valor);
  task.cycleKey = currentKey(task.freq);
  render();
  salvarTarefa(task);
}

function adicionarMeta(taskId, valorAlvo){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const alvo = Number(valorAlvo);
  if(!(alvo > 0)) return; // precisa de um número válido maior que zero
  task.meta = { alvo, atual: 0 };
  task.cycleKey = currentKey(task.freq); // já entra sincronizada com o ciclo atual
  render();
  salvarTarefa(task);
}

function removerMeta(taskId){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const ok = window.confirm('Remover a meta desta tarefa? Ela deixa de ficar travada e pode ser concluída livremente.');
  if(!ok) return;
  task.meta = null;
  render();
  salvarTarefa(task);
}

// Painel pra ADICIONAR uma meta numa tarefa que ainda não tem uma.
// Uma vez adicionada, o lugar dele é tomado pelo buildMetaPanel normal.
function buildAddMetaPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'meta:';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '0.01';
  input.placeholder = 'valor alvo (ex: 8000)';
  row.appendChild(input);

  const addBtn = document.createElement('button');
  addBtn.textContent = 'adicionar meta';
  addBtn.onclick = () => adicionarMeta(task.id, input.value);
  row.appendChild(addBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') adicionarMeta(task.id, input.value);
  });

  panel.appendChild(row);
  return panel;
}

const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WEEKDAYS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

function renderTodayLabel(){
  const d = new Date();
  document.getElementById('todayLabel').textContent =
    WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
}

function periodLabelFor(freq){
  const d = new Date();
  if(freq === 'daily') return 'hoje · ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
  if(freq === 'weekly') return 'esta semana';
  if(freq === 'monthly') return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  return 'sem prazo';
}

const GROUPS = [
  {freq:'daily', label:'Diárias'},
  {freq:'weekly', label:'Semanais'},
  {freq:'monthly', label:'Mensais'},
  {freq:'once', label:'Únicas'}
];

let viewMode = 'freq'; // 'freq' (padrão, por Diária/Semanal/...) ou 'pasta'
let showBlocked = false; // tarefas travadas por meta ficam escondidas por padrão
let blocos = []; // blocos da Grade Horária, um por dia da semana
let diaGradeSelecionado = new Date().getDay(); // qual dia da semana está sendo visualizado na Grade
let blocoEditandoId = null; // qual bloco está com o formulário de edição aberto
let eventos = []; // eventos do Calendário (usuarios/{uid}/eventos), carregados do Firestore
let mesCalendarioAtual = new Date(); // qual mês está sendo exibido na tela Calendário
let eventoFormAbertoParaDia = null; // 'AAAA-MM-DD' do dia clicado pra criar um evento novo, ou null
let eventoEditandoId = null; // id do evento com o formulário de edição aberto, ou null

function getVisibleTasks(){
  const hoje = new Date().getDay();
  return tasks
    .filter(t => selectedCategory === 'all' || (t.category || 'Geral') === selectedCategory)
    .filter(t => currentMode === 'ambos' || !t.regime || t.regime === currentMode)
    .filter(t => showBlocked || metaAtingida(t))
    .filter(t => diaEhAtivoParaTarefa(t, hoje));
}

// Monta a lista de "grupos" a exibir, já com as tarefas de cada um dentro.
// Centralizar essa lógica aqui (em vez de espalhar em render() e moveTask())
// garante que os dois enxerguem exatamente os mesmos grupos, na mesma ordem.
// O id da tarefa é 't' + Date.now() (13 dígitos) + sufixo aleatório — então dá
// pra extrair a data de criação dali, sem precisar guardar um campo à parte.
function dataDeCriacao(task){
  const timestamp = parseInt(String(task.id).slice(1, 14), 10);
  return Number.isFinite(timestamp) ? timestamp : 0;
}

function getGroupsToRender(){
  const visivel = getVisibleTasks();

  // tarefas fixadas (📌) sempre no topo do grupo delas — o sort é estável,
  // então dentro de cada bloco (fixadas / não fixadas) a ordem de sempre
  // (campo "ordem") continua sendo respeitada
  function comFixadasNoTopo(lista){
    return lista.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  }

  if(viewMode === 'pasta'){
    const nomesDePasta = Array.from(new Set(visivel.map(t => t.pasta || null)));
    nomesDePasta.sort((a, b) => {
      if(a === null) return 1;   // "Sem pasta" sempre por último
      if(b === null) return -1;
      return a.localeCompare(b, 'pt-BR');
    });
    return nomesDePasta.map(nome => ({
      type: 'pasta',
      pastaName: nome, // null pra "Sem pasta"
      label: nome || 'Sem pasta',
      tasksInGroup: comFixadasNoTopo(visivel.filter(t => (t.pasta || null) === nome))
    }));
  }

  if(viewMode === 'data-antigas' || viewMode === 'data-recentes'){
    const multiplicador = viewMode === 'data-antigas' ? 1 : -1;
    const ordenadas = visivel
      .slice()
      .sort((a, b) => multiplicador * (dataDeCriacao(a) - dataDeCriacao(b)));
    return [{
      type: 'data',
      label: viewMode === 'data-antigas' ? 'Mais antigas primeiro' : 'Mais recentes primeiro',
      // aqui a ordem já É a data de inclusão — colocar fixadas no topo
      // bagunçaria justamente o que esse modo existe pra mostrar
      tasksInGroup: ordenadas
    }];
  }

  return GROUPS.map(g => ({
    type: 'freq',
    freq: g.freq,
    label: g.label,
    tasksInGroup: comFixadasNoTopo(visivel.filter(t => t.freq === g.freq))
  }));
}

function distinctPastas(){
  const set = new Set(tasks.map(t => t.pasta).filter(Boolean));
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function renomearPasta(nomeAntigo){
  const novoNome = window.prompt('Novo nome da pasta:', nomeAntigo);
  if(novoNome === null) return; // cancelou
  const nome = novoNome.trim();
  if(!nome || nome === nomeAntigo) return;
  const afetadas = tasks.filter(t => (t.pasta || null) === nomeAntigo);
  afetadas.forEach(t => { t.pasta = nome; });
  render();
  salvarVariasTarefas(afetadas, []);
}

function desfazerPasta(nomePasta){
  const ok = window.confirm('Isso só solta as tarefas da pasta "' + nomePasta + '" — nenhuma tarefa é apagada. Continuar?');
  if(!ok) return;
  const afetadas = tasks.filter(t => (t.pasta || null) === nomePasta);
  afetadas.forEach(t => { t.pasta = null; });
  render();
  salvarVariasTarefas(afetadas, []);
}

// ---------- Grade Horária (blocos por dia da semana) ----------
// Diferente da Lista de tarefas, isso é uma grade FIXA (tipo uma grade
// escolar): cada bloco pertence a um dia da semana específico (0=domingo
// ... 6=sábado) e tem hora de início/fim. Um bloco pode estar "vinculado"
// a uma tarefa de verdade do checklist (mostra checkbox, clica marca) ou
// ser só um rótulo informativo (ex: "Transporte", "Descanso") sem vínculo
// nenhum com o checklist.

function renderDiaSeletor(){
  document.querySelectorAll('#diaSeletor .day-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.day) === diaGradeSelecionado);
  });
}

function renderGrade(){
  renderDiaSeletor();

  const nomeDia = WEEKDAYS[diaGradeSelecionado];
  document.getElementById('gradeHeader').textContent = nomeDia.charAt(0).toUpperCase() + nomeDia.slice(1);

  const blocosDoDia = blocos
    .filter(b => b.dia === diaGradeSelecionado)
    .slice()
    .sort((a, b) => a.inicio.localeCompare(b.inicio) || a.fim.localeCompare(b.fim));

  const container = document.getElementById('gradeSlots');
  container.innerHTML = '';

  if(blocosDoDia.length === 0){
    const msg = document.createElement('div');
    msg.className = 'sem-horario-msg';
    msg.textContent = 'Nenhum bloco cadastrado pra esse dia ainda. Use o formulário abaixo pra adicionar.';
    container.appendChild(msg);
  } else {
    blocosDoDia.forEach(bloco => {
      container.appendChild(buildBlocoRow(bloco));
    });
  }

  container.appendChild(buildAddBlocoForm());
}

function buildBlocoRow(bloco){
  const tarefaVinculada = bloco.taskId ? tasks.find(t => t.id === bloco.taskId) : null;
  const done = tarefaVinculada ? isDone(tarefaVinculada) : false;

  const wrap = document.createElement('div');
  wrap.className = 'bloco-wrap';

  const row = document.createElement('div');
  row.className = 'compromisso' + (done ? ' done' : '');
  // risco da esquerda na cor escolhida (sem cor salva = o verde de sempre, do CSS)
  if(bloco.cor && /^#[0-9a-fA-F]{6}$/.test(bloco.cor)) row.style.borderLeftColor = bloco.cor;

  if(tarefaVinculada){
    const temPassos = tarefaVinculada.subtasks && tarefaVinculada.subtasks.length > 0;
    const bloqueada = tarefaVinculada.meta && !metaAtingida(tarefaVinculada);
    if(!temPassos && !bloqueada){
      row.onclick = () => toggleTask(tarefaVinculada.id);
      row.style.cursor = 'pointer';
    }
  }

  const horaEl = document.createElement('span');
  horaEl.className = 'bloco-hora';
  horaEl.textContent = bloco.inicio + '–' + bloco.fim;
  row.appendChild(horaEl);

  const texto = document.createElement('span');
  texto.className = 'compromisso-texto';
  texto.textContent = bloco.texto;
  row.appendChild(texto);

  if(tarefaVinculada){
    const tag = document.createElement('span');
    tag.className = 'compromisso-tag';
    tag.textContent = '✓ vinculado';
    row.appendChild(tag);
  }

  const editBtn = document.createElement('button');
  editBtn.className = 'edit-btn';
  editBtn.textContent = 'editar';
  editBtn.onclick = (e) => {
    e.stopPropagation();
    blocoEditandoId = (blocoEditandoId === bloco.id) ? null : bloco.id;
    renderGrade();
  };
  row.appendChild(editBtn);

  wrap.appendChild(row);

  if(blocoEditandoId === bloco.id){
    wrap.appendChild(buildEditarBlocoForm(bloco));
  }

  return wrap;
}

function buildEditarBlocoForm(bloco){
  const form = document.createElement('div');
  form.className = 'bloco-form';

  const inicioInput = document.createElement('input');
  inicioInput.type = 'time';
  inicioInput.value = bloco.inicio;

  const fimInput = document.createElement('input');
  fimInput.type = 'time';
  fimInput.value = bloco.fim;

  const textoInput = document.createElement('input');
  textoInput.type = 'text';
  textoInput.value = bloco.texto;
  textoInput.maxLength = 80;
  textoInput.placeholder = 'descrição do bloco';

  const vinculoSelect = criarSeletorDeTarefa(bloco.taskId);
  const seletorCor = criarSeletorDeCorBloco(corDoBloco(bloco));

  const salvarBtn = document.createElement('button');
  salvarBtn.textContent = 'salvar';
  salvarBtn.onclick = () => {
    const blocoAtualizado = {
      ...bloco,
      // se o campo de horário for esvaziado, mantém o horário antigo (um valor
      // vazio quebraria a ordenação por horário)
      inicio: inicioInput.value || bloco.inicio,
      fim: fimInput.value || bloco.fim,
      texto: textoInput.value.trim() || bloco.texto,
      taskId: vinculoSelect.value || null,
      cor: seletorCor.obterCor()
    };
    // atualiza a lista local NA HORA e redesenha — igual o "adicionar bloco" já
    // faz. Antes só mandava pro Firestore e esperava a resposta dele voltar pra
    // tela se atualizar, então o bloco ficava no lugar antigo até lá.
    blocos = blocos.map(b => b.id === bloco.id ? blocoAtualizado : b);
    blocoEditandoId = null;
    renderGrade();
    salvarBloco(blocoAtualizado);
  };

  const removerBtn = document.createElement('button');
  removerBtn.textContent = 'remover bloco';
  removerBtn.onclick = () => {
    apagarBlocoDoc(bloco.id);
    blocos = blocos.filter(b => b.id !== bloco.id);
    blocoEditandoId = null;
    renderGrade();
  };

  form.appendChild(inicioInput);
  form.appendChild(fimInput);
  form.appendChild(textoInput);
  form.appendChild(vinculoSelect);
  form.appendChild(seletorCor);
  form.appendChild(salvarBtn);
  form.appendChild(removerBtn);
  return form;
}

// ---------- Cor dos blocos da grade ----------
// Mesma paleta dos eventos do calendário. O verde é o padrão: é a cor do risco
// que os blocos já tinham antes do seletor, então blocos antigos (sem "cor"
// salva) continuam iguais.
const COR_BLOCO_PADRAO = '#1D9E75';

function corDoBloco(bloco){
  return (bloco && /^#[0-9a-fA-F]{6}$/.test(bloco.cor || '')) ? bloco.cor : COR_BLOCO_PADRAO;
}

// Linha "Cor:" com as bolinhas da paleta. Devolve o elemento; a cor escolhida
// fica disponível em elemento.obterCor() (usado ao clicar em salvar/adicionar).
function criarSeletorDeCorBloco(corInicial){
  let corAtual = corInicial;
  const wrap = document.createElement('div');
  wrap.className = 'cor-seletor';
  wrap.appendChild(document.createTextNode('Cor:'));
  const bolinhas = [];
  CORES_EVENTO.forEach(({ hex, nome }) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cor-opcao';
    b.style.background = hex;
    b.title = nome;
    b.setAttribute('aria-label', nome);
    b.classList.toggle('selecionada', hex.toLowerCase() === corAtual.toLowerCase());
    b.onclick = () => {
      corAtual = hex;
      bolinhas.forEach(x => x.classList.toggle('selecionada', x === b));
    };
    bolinhas.push(b);
    wrap.appendChild(b);
  });
  wrap.obterCor = () => corAtual;
  return wrap;
}

// Select reaproveitado tanto pra criar quanto pra editar um bloco —
// lista todas as tarefas atuais, pra você escolher vincular ou não.
function criarSeletorDeTarefa(taskIdSelecionado){
  const select = document.createElement('select');
  const optionVazia = document.createElement('option');
  optionVazia.value = '';
  optionVazia.textContent = 'sem tarefa vinculada';
  select.appendChild(optionVazia);

  tasks.slice().sort((a, b) => a.text.localeCompare(b.text, 'pt-BR')).forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.text;
    if(t.id === taskIdSelecionado) opt.selected = true;
    select.appendChild(opt);
  });
  return select;
}

function buildAddBlocoForm(){
  const form = document.createElement('div');
  form.className = 'bloco-form bloco-form-novo';

  const inicioInput = document.createElement('input');
  inicioInput.type = 'time';

  const fimInput = document.createElement('input');
  fimInput.type = 'time';

  const textoInput = document.createElement('input');
  textoInput.type = 'text';
  textoInput.maxLength = 80;
  textoInput.placeholder = 'descrição do bloco (ex: Academia, Relatório...)';

  const vinculoSelect = criarSeletorDeTarefa(null);
  const seletorCor = criarSeletorDeCorBloco(COR_BLOCO_PADRAO);

  const addBtn = document.createElement('button');
  addBtn.textContent = '+ adicionar bloco';
  addBtn.onclick = () => {
    const texto = textoInput.value.trim();
    if(!texto || !inicioInput.value || !fimInput.value) return;
    adicionarBloco({
      dia: diaGradeSelecionado,
      inicio: inicioInput.value,
      fim: fimInput.value,
      texto: texto,
      taskId: vinculoSelect.value || null,
      cor: seletorCor.obterCor()
    });
    textoInput.value = '';
    inicioInput.value = '';
    fimInput.value = '';
  };

  form.appendChild(inicioInput);
  form.appendChild(fimInput);
  form.appendChild(textoInput);
  form.appendChild(vinculoSelect);
  form.appendChild(seletorCor);
  form.appendChild(addBtn);
  return form;
}

// ---------- Cores dos eventos ----------
// Paleta que aparece no seletor do formulário. O primeiro azul é o padrão: é a
// cor que os eventos já tinham antes do seletor existir, então eventos antigos
// (sem o campo "cor" salvo) continuam com a mesma aparência.
const COR_EVENTO_PADRAO = '#1D6FA5';
const CORES_EVENTO = [
  { hex: '#1D6FA5', nome: 'Azul' },
  { hex: '#1D9E75', nome: 'Verde' },
  { hex: '#BA7517', nome: 'Âmbar' },
  { hex: '#534AB7', nome: 'Roxo' },
  { hex: '#B4483C', nome: 'Vermelho' },
  { hex: '#C2477F', nome: 'Rosa' },
  { hex: '#1B8A8F', nome: 'Turquesa' },
  { hex: '#5F5E5A', nome: 'Cinza' }
];

// Devolve a cor do evento, ou o azul padrão se não tiver (ou se estiver inválida)
function corDoEvento(ev){
  return (ev && /^#[0-9a-fA-F]{6}$/.test(ev.cor || '')) ? ev.cor : COR_EVENTO_PADRAO;
}

// '#1D6FA5' + 0.18 -> 'rgba(29, 111, 165, 0.18)' (fundo clarinho da etiqueta)
function hexParaRgba(hex, alfa){
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + alfa + ')';
}

// Decide se um evento acontece num dia específico do calendário —
// considerando eventos de data única, de vários dias, e os recorrentes
// (mensal/anual), sem precisar duplicar o evento pra cada ocorrência.
function eventoOcorreEm(evento, ano, mes, dia){
  const dataAlvo = new Date(ano, mes, dia);
  const inicio = new Date(evento.dataInicio + 'T00:00:00');

  if(evento.recorrencia === 'anual'){
    return inicio.getMonth() === mes && inicio.getDate() === dia;
  }
  if(evento.recorrencia === 'mensal'){
    return inicio.getDate() === dia;
  }
  const fim = new Date((evento.dataFim || evento.dataInicio) + 'T00:00:00');
  return dataAlvo >= inicio && dataAlvo <= fim;
}

function eventosNoDia(ano, mes, dia){
  return eventos.filter(ev => eventoOcorreEm(ev, ano, mes, dia));
}

// 'AAAA-MM-DD', o mesmo formato que os <input type="date"> usam e que
// salvamos em evento.dataInicio/dataFim
function dataISO(ano, mes, dia){
  return ano + '-' + pad(mes + 1) + '-' + pad(dia);
}

// Monta os "pedaços" (segmentos) de evento de UMA semana do calendário.
// Um evento de vários dias vira uma barra única que atravessa as colunas dos
// dias, e se continuar na semana seguinte ganha um novo pedaço lá (igual ao
// Google Agenda). Eventos de um dia só (e os recorrentes) viram pedaços de
// largura 1. 'dias' tem 7 itens: o número do dia do mês, ou null se aquela
// coluna cai fora do mês exibido.
function montarSegmentosDaSemana(ano, mes, dias){
  const segmentos = [];
  const isoDaColuna = col => dataISO(ano, mes, dias[col]);

  eventos.forEach(ev => {
    const recorrente = ev.recorrencia === 'anual' || ev.recorrencia === 'mensal';
    const fimISO = ev.dataFim || ev.dataInicio;
    const multi = !recorrente && fimISO !== ev.dataInicio;

    if(recorrente){
      // recorrentes: cada ocorrência é um dia só
      dias.forEach((dia, col) => {
        if(dia !== null && eventoOcorreEm(ev, ano, mes, dia)){
          segmentos.push({ ev, c0: col, c1: col, esq: false, dir: false, multi: false });
        }
      });
      return;
    }

    // não recorrente: acha o primeiro e o último dia desta semana que o evento cobre
    let c0 = -1, c1 = -1;
    dias.forEach((dia, col) => {
      if(dia !== null && eventoOcorreEm(ev, ano, mes, dia)){
        if(c0 === -1) c0 = col;
        c1 = col;
      }
    });
    if(c0 === -1) return;
    segmentos.push({
      ev, c0, c1, multi,
      esq: ev.dataInicio < isoDaColuna(c0),  // já tinha começado antes: ponta esquerda reta
      dir: fimISO > isoDaColuna(c1)          // continua depois: ponta direita reta
    });
  });

  // ordem de colocação: barras de vários dias primeiro (ficam no topo),
  // depois os de um dia; dentro disso, os que começam antes e os mais longos primeiro
  segmentos.sort((a, b) =>
    (b.multi - a.multi) ||
    (a.c0 - b.c0) ||
    // quem começou antes fica por cima, assim a mesma barra mantém a mesma
    // ordem de uma semana para a outra
    (a.ev.dataInicio || '').localeCompare(b.ev.dataInicio || '') ||
    ((b.c1 - b.c0) - (a.c1 - a.c0)) ||
    ((a.ev.horario || '').localeCompare(b.ev.horario || '')) ||
    ((a.ev.titulo || '').localeCompare(b.ev.titulo || ''))
  );

  // distribui em "faixas" (linhas): cada segmento vai pra primeira faixa onde
  // não bate com outro já colocado
  const faixas = [];
  segmentos.forEach(seg => {
    let i = 0;
    while(i < faixas.length && faixas[i].some(o => !(seg.c1 < o.c0 || seg.c0 > o.c1))) i++;
    if(i === faixas.length) faixas.push([]);
    faixas[i].push(seg);
    seg.faixa = i;
  });
  return { segmentos, totalFaixas: faixas.length };
}

function renderCalendario(){
  const grid = document.getElementById('calendarioGrid');
  grid.innerHTML = '';

  const ano = mesCalendarioAtual.getFullYear();
  const mes = mesCalendarioAtual.getMonth();

  document.getElementById('calendarioLabel').textContent =
    mesCalendarioAtual.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  const primeiroDia = new Date(ano, mes, 1);
  const ultimoDia = new Date(ano, mes + 1, 0);
  const diaSemanaDoInicio = primeiroDia.getDay(); // 0 = domingo
  const totalDiasNoMes = ultimoDia.getDate();
  const hoje = new Date();
  const faixasMinimas = window.innerWidth <= 480 ? 2 : 3; // altura mínima de cada semana

  // quantas semanas (linhas) o mês ocupa
  const totalSemanas = Math.ceil((diaSemanaDoInicio + totalDiasNoMes) / 7);

  for(let semana = 0; semana < totalSemanas; semana++){
    // número do dia em cada uma das 7 colunas (null = fora do mês)
    const dias = [];
    for(let col = 0; col < 7; col++){
      const dia = semana * 7 + col - diaSemanaDoInicio + 1;
      dias.push(dia >= 1 && dia <= totalDiasNoMes ? dia : null);
    }

    const { segmentos, totalFaixas } = montarSegmentosDaSemana(ano, mes, dias);
    const faixas = Math.max(totalFaixas, faixasMinimas);

    // Um evento pode ocupar DUAS linhas (título quebrando pra de baixo) quando a
    // faixa logo abaixo existe e está livre em todas as colunas que ele cobre.
    // Se tiver outro evento embaixo, fica em uma linha só, com o texto cortado.
    const livreAbaixo = seg =>
      seg.faixa + 1 < faixas &&
      !segmentos.some(o => o.faixa === seg.faixa + 1 && !(o.c1 < seg.c0 || o.c0 > seg.c1));

    // cada semana é uma grade de 7 colunas: linha 1 = número do dia,
    // linhas seguintes = as faixas de eventos
    const linha = document.createElement('div');
    linha.className = 'cal-week';
    linha.style.gridTemplateRows = '20px repeat(' + faixas + ', 17px)';

    // fundo: uma "caixinha" por dia, ocupando a semana inteira na vertical
    dias.forEach((dia, col) => {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.style.gridColumn = String(col + 1);
      cell.style.gridRow = '1 / ' + (faixas + 2);
      if(dia === null){
        cell.classList.add('empty');
        linha.appendChild(cell);
        return;
      }
      const ehHoje = hoje.getFullYear() === ano && hoje.getMonth() === mes && hoje.getDate() === dia;
      if(ehHoje) cell.classList.add('hoje');

      // clicar em qualquer parte "vazia" da célula abre o formulário de
      // criar evento nesse dia — o stopPropagation nas barras de evento
      // (abaixo) evita que clicar num evento existente dispare isso também
      cell.onclick = () => {
        eventoEditandoId = null;
        eventoFormAbertoParaDia = dataISO(ano, mes, dia);
        renderCalendario();
      };

      const numero = document.createElement('div');
      numero.className = 'cal-day-num';
      numero.textContent = dia;
      cell.appendChild(numero);
      linha.appendChild(cell);
    });

    // por cima: as barras/etiquetas de evento, posicionadas por coluna e faixa
    segmentos.forEach(seg => {
      const tag = document.createElement('div');
      tag.className = 'cal-evento' + (seg.multi ? ' multi' : '');
      tag.textContent = seg.ev.titulo;
      tag.style.gridColumn = (seg.c0 + 1) + ' / span ' + (seg.c1 - seg.c0 + 1);
      if(livreAbaixo(seg)){
        tag.classList.add('duas-linhas');
        tag.style.gridRow = (seg.faixa + 2) + ' / span 2';
      }else{
        tag.style.gridRow = String(seg.faixa + 2);
      }
      // passando o mouse mostra o título completo e as anotações, se houver
      tag.title = seg.ev.notas ? seg.ev.titulo + '\n\n' + seg.ev.notas : seg.ev.titulo;

      const cor = corDoEvento(seg.ev);
      if(seg.multi){
        // barra contínua: cor cheia, texto branco; ponta reta onde o evento continua
        tag.style.background = cor;
        tag.style.color = '#fff';
        tag.style.marginLeft = seg.esq ? '0' : '2px';
        tag.style.marginRight = seg.dir ? '0' : '2px';
        tag.style.borderRadius =
          (seg.esq ? '0' : '4px') + ' ' + (seg.dir ? '0' : '4px') + ' ' +
          (seg.dir ? '0' : '4px') + ' ' + (seg.esq ? '0' : '4px');
      }else{
        // evento de um dia: fundo clarinho com faixa colorida à esquerda
        tag.style.background = hexParaRgba(cor, 0.18);
        tag.style.borderLeft = '3px solid ' + cor;
        tag.style.color = 'var(--ink)';
        tag.style.marginLeft = '2px';
        tag.style.marginRight = '2px';
      }

      tag.onclick = (e) => {
        e.stopPropagation();
        eventoFormAbertoParaDia = null;
        eventoEditandoId = seg.ev.id;
        renderCalendario();
      };
      linha.appendChild(tag);
    });

    grid.appendChild(linha);
  }

  buildEventoFormArea();
}

// Monta o formulário de criar (eventoFormAbertoParaDia) ou editar
// (eventoEditandoId) um evento. Só um dos dois fica ativo por vez.
function buildEventoFormArea(){
  const area = document.getElementById('calendarioFormArea');
  area.innerHTML = '';

  const criando = !!eventoFormAbertoParaDia;
  const editando = !!eventoEditandoId;
  if(!criando && !editando) return;

  const eventoAtual = editando ? eventos.find(e => e.id === eventoEditandoId) : null;
  if(editando && !eventoAtual) { eventoEditandoId = null; return; }

  const painel = document.createElement('div');
  painel.className = 'cal-form';

  const titulo = document.createElement('div');
  titulo.textContent = editando
    ? 'Editar evento'
    : 'Novo evento em ' + eventoFormAbertoParaDia.split('-').reverse().join('/');
  titulo.style.marginBottom = '10px';
  titulo.style.fontWeight = 'bold';
  painel.appendChild(titulo);

  // ---- linha: título do evento ----
  const linhaTitulo = document.createElement('div');
  linhaTitulo.className = 'cal-form-row';
  const inputTitulo = document.createElement('input');
  inputTitulo.type = 'text';
  inputTitulo.placeholder = 'Título do evento';
  inputTitulo.value = eventoAtual ? eventoAtual.titulo : '';
  linhaTitulo.appendChild(inputTitulo);
  painel.appendChild(linhaTitulo);

  // ---- linha: data de início / vários dias / data de fim ----
  const linhaData = document.createElement('div');
  linhaData.className = 'cal-form-row';

  const inputInicio = document.createElement('input');
  inputInicio.type = 'date';
  inputInicio.value = eventoAtual ? eventoAtual.dataInicio : eventoFormAbertoParaDia;
  linhaData.appendChild(inputInicio);

  const labelVariosDias = document.createElement('label');
  const checkVariosDias = document.createElement('input');
  checkVariosDias.type = 'checkbox';
  const temVariosDias = !!(eventoAtual && eventoAtual.dataFim && eventoAtual.dataFim !== eventoAtual.dataInicio);
  checkVariosDias.checked = temVariosDias;
  labelVariosDias.appendChild(checkVariosDias);
  labelVariosDias.appendChild(document.createTextNode(' vários dias'));
  linhaData.appendChild(labelVariosDias);

  const inputFim = document.createElement('input');
  inputFim.type = 'date';
  inputFim.value = eventoAtual ? (eventoAtual.dataFim || eventoAtual.dataInicio) : eventoFormAbertoParaDia;
  inputFim.style.display = temVariosDias ? '' : 'none';
  linhaData.appendChild(inputFim);

  checkVariosDias.onchange = () => {
    inputFim.style.display = checkVariosDias.checked ? '' : 'none';
  };

  painel.appendChild(linhaData);

  // ---- linha: dia todo / horário ----
  const linhaHorario = document.createElement('div');
  linhaHorario.className = 'cal-form-row';

  const labelDiaTodo = document.createElement('label');
  const checkDiaTodo = document.createElement('input');
  checkDiaTodo.type = 'checkbox';
  const ehDiaTodo = !eventoAtual || !eventoAtual.horario;
  checkDiaTodo.checked = ehDiaTodo;
  labelDiaTodo.appendChild(checkDiaTodo);
  labelDiaTodo.appendChild(document.createTextNode(' dia todo'));
  linhaHorario.appendChild(labelDiaTodo);

  const inputHorario = document.createElement('input');
  inputHorario.type = 'time';
  inputHorario.value = eventoAtual && eventoAtual.horario ? eventoAtual.horario : '';
  inputHorario.style.display = ehDiaTodo ? 'none' : '';
  linhaHorario.appendChild(inputHorario);

  checkDiaTodo.onchange = () => {
    inputHorario.style.display = checkDiaTodo.checked ? 'none' : '';
  };

  painel.appendChild(linhaHorario);

  // ---- linha: recorrência ----
  const linhaRecorrencia = document.createElement('div');
  linhaRecorrencia.className = 'cal-form-row';
  linhaRecorrencia.appendChild(document.createTextNode('Repete:'));
  const selectRecorrencia = document.createElement('select');
  [['nenhuma', 'Não repete'], ['mensal', 'Todo mês'], ['anual', 'Todo ano']].forEach(([valor, texto]) => {
    const opt = document.createElement('option');
    opt.value = valor;
    opt.textContent = texto;
    if(eventoAtual && eventoAtual.recorrencia === valor) opt.selected = true;
    if(!eventoAtual && valor === 'nenhuma') opt.selected = true;
    selectRecorrencia.appendChild(opt);
  });
  linhaRecorrencia.appendChild(selectRecorrencia);
  painel.appendChild(linhaRecorrencia);

  // ---- linha: cor do evento ----
  let corSelecionada = corDoEvento(eventoAtual);
  const linhaCor = document.createElement('div');
  linhaCor.className = 'cal-form-row';
  linhaCor.appendChild(document.createTextNode('Cor:'));
  const bolinhas = [];
  CORES_EVENTO.forEach(({ hex, nome }) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cal-cor-opcao';
    b.style.background = hex;
    b.title = nome;
    b.setAttribute('aria-label', nome);
    b.classList.toggle('selecionada', hex === corSelecionada);
    b.onclick = () => {
      corSelecionada = hex;
      bolinhas.forEach(x => x.classList.toggle('selecionada', x === b));
    };
    bolinhas.push(b);
    linhaCor.appendChild(b);
  });
  painel.appendChild(linhaCor);

  // ---- linha: anotações do evento (igual à "descrição" do Google Agenda) ----
  const linhaNotas = document.createElement('div');
  linhaNotas.className = 'cal-form-row cal-form-notas';
  const inputNotas = document.createElement('textarea');
  inputNotas.rows = 3;
  inputNotas.placeholder = 'Anotações (opcional): endereço, link, o que levar...';
  inputNotas.value = (eventoAtual && eventoAtual.notas) || '';
  linhaNotas.appendChild(inputNotas);
  painel.appendChild(linhaNotas);

  // ---- botões ----
  const acoes = document.createElement('div');
  acoes.className = 'cal-form-actions';

  const btnSalvar = document.createElement('button');
  btnSalvar.textContent = 'Salvar';
  btnSalvar.onclick = () => {
    const dadosEvento = {
      titulo: inputTitulo.value.trim() || 'Sem título',
      dataInicio: inputInicio.value,
      dataFim: checkVariosDias.checked ? inputFim.value : inputInicio.value,
      horario: checkDiaTodo.checked ? null : inputHorario.value,
      recorrencia: selectRecorrencia.value,
      cor: corSelecionada,
      notas: inputNotas.value.trim()
    };
    if(!dadosEvento.dataInicio) return; // sem data não tem como salvar
    if(editando){
      atualizarEvento(eventoEditandoId, dadosEvento);
    }else{
      adicionarEvento(dadosEvento);
    }
  };
  acoes.appendChild(btnSalvar);

  if(editando){
    const btnApagar = document.createElement('button');
    btnApagar.className = 'cal-apagar';
    btnApagar.textContent = 'Apagar';
    btnApagar.onclick = () => removerEvento(eventoEditandoId);
    acoes.appendChild(btnApagar);
  }

  const btnCancelar = document.createElement('button');
  btnCancelar.className = 'cal-cancelar';
  btnCancelar.textContent = 'Cancelar';
  btnCancelar.onclick = () => {
    eventoFormAbertoParaDia = null;
    eventoEditandoId = null;
    renderCalendario();
  };
  acoes.appendChild(btnCancelar);

  painel.appendChild(acoes);
  area.appendChild(painel);
}

function render(){
  renderCatBar();
  renderModeBar();
  renderViewBar();
  renderMetaBar();
  const container = document.getElementById('groups');
  container.innerHTML = '';

  const datalistPastas = document.getElementById('pastaOptions');
  datalistPastas.innerHTML = distinctPastas().map(p => '<option value="' + p.replace(/"/g,'') + '">').join('');

  getGroupsToRender().forEach(g => {
    const groupTasks = g.tasksInGroup;
    const doneCount = groupTasks.filter(isDone).length;

    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';

    const tabSpan = document.createElement('span');
    tabSpan.className = 'tab ' + (g.type === 'freq' ? g.freq : (g.type === 'data' ? 'data' : 'pasta'));
    tabSpan.textContent = g.label;
    head.appendChild(tabSpan);

    if(g.type === 'freq'){
      const periodSpan = document.createElement('span');
      periodSpan.className = 'period-label';
      periodSpan.textContent = periodLabelFor(g.freq);
      head.appendChild(periodSpan);
    } else if(g.pastaName){
      const renameBtn = document.createElement('button');
      renameBtn.className = 'pasta-action';
      renameBtn.textContent = 'renomear';
      renameBtn.onclick = () => renomearPasta(g.pastaName);
      const desfazerBtn = document.createElement('button');
      desfazerBtn.className = 'pasta-action';
      desfazerBtn.textContent = 'desfazer pasta';
      desfazerBtn.onclick = () => desfazerPasta(g.pastaName);
      head.appendChild(renameBtn);
      head.appendChild(desfazerBtn);
    }

    const progressSpan = document.createElement('span');
    progressSpan.className = 'progress';
    progressSpan.textContent = doneCount + '/' + groupTasks.length;
    head.appendChild(progressSpan);

    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'tasks';

    if(groupTasks.length === 0){
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'nenhuma tarefa aqui ainda';
      ul.appendChild(li);
    } else {
      groupTasks.forEach((task, idx) => {
        const done = isDone(task);
        const li = document.createElement('li');
        const classes = [];
        if(expandedTaskId === task.id) classes.push('expanded');
        if(task.missed && !done) classes.push('missed');
        if(task.pinned) classes.push('pinned-row');
        const bloqueadaPorMeta = task.meta && !metaAtingida(task);
        if(bloqueadaPorMeta) classes.push('meta-bloqueada');
        li.className = classes.join(' ');

        const moveBtns = document.createElement('div');
        moveBtns.className = 'move-btns';
        const upBtn = document.createElement('button');
        upBtn.className = 'move-btn';
        upBtn.textContent = '▲';
        upBtn.disabled = idx === 0;
        upBtn.onclick = (e) => { e.stopPropagation(); moveTask(task.id, -1); };
        const downBtn = document.createElement('button');
        downBtn.className = 'move-btn';
        downBtn.textContent = '▼';
        downBtn.disabled = idx === groupTasks.length - 1;
        downBtn.onclick = (e) => { e.stopPropagation(); moveTask(task.id, 1); };
        moveBtns.appendChild(upBtn);
        moveBtns.appendChild(downBtn);
        li.appendChild(moveBtns);

        const temPassos = task.subtasks && task.subtasks.length > 0;

        const check = document.createElement('div');
        const comDescricao = temDescricao(task);
        const abrirOuFecharClique = () => {
          subtasksOpenId = (subtasksOpenId === task.id) ? null : task.id;
          render();
        };
        if(bloqueadaPorMeta){
          // travada: mostra o progresso da meta no lugar do check, sem
          // dar pra marcar enquanto não bater o valor alvo
          check.className = 'check meta-locked';
          check.textContent = '🔒 ' + task.meta.atual.toLocaleString('pt-BR') + '/' + task.meta.alvo.toLocaleString('pt-BR');
          if(comDescricao){
            li.onclick = abrirOuFecharClique;
            li.style.cursor = 'pointer';
          }
        } else if(temPassos){
          const feitos = task.subtasks.filter(s => s.done).length;
          check.className = 'check pipeline-badge' + (done ? ' done' : '');
          check.textContent = feitos + '/' + task.subtasks.length;
          // tarefa mãe não tem "marcar direto" — clicar nela só abre/fecha os
          // mini-passos, sem mexer no painel de editar (pasta/meta/nome ficam
          // só no botão "editar" mesmo)
          li.onclick = () => {
            subtasksOpenId = (subtasksOpenId === task.id) ? null : task.id;
            render();
          };
          li.style.cursor = 'pointer';
        } else {
          check.className = 'check' + (done ? ' done' : '');
          check.textContent = done ? '✓' : '';
          check.onclick = (e) => { e.stopPropagation(); toggleTask(task.id); };
          // clicar em qualquer parte do retângulo da tarefa também marca/desmarca —
          // não só no quadradinho pequeno. Editar/mover/remover têm seu próprio
          // stopPropagation, então continuam funcionando normalmente por cima disso.
          // EXCEÇÃO: tarefa com descrição — o clique na linha abre/fecha a
          // descrição, e só o quadradinho marca como feita.
          li.onclick = comDescricao ? abrirOuFecharClique : () => toggleTask(task.id);
          li.style.cursor = 'pointer';
        }

        let textEl;
        if(expandedTaskId === task.id){
          textEl = document.createElement('input');
          textEl.type = 'text';
          textEl.className = 'task-edit-input';
          textEl.value = task.text;
          textEl.maxLength = 120;
          textEl.onclick = (e) => e.stopPropagation();
          textEl.addEventListener('blur', () => renomearTarefa(task.id, textEl.value));
          textEl.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){ e.preventDefault(); textEl.blur(); } // blur() já salva
            if(e.key === 'Escape'){ expandedTaskId = null; render(); }
          });
        } else {
          textEl = document.createElement('span');
          textEl.className = 'task-text' + (done ? ' done' : '');
          textEl.textContent = task.text;
        }

        li.appendChild(check);
        li.appendChild(textEl);

        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'task-tags';

        if(comDescricao){
          const descTag = document.createElement('span');
          descTag.className = 'task-desc-ico';
          descTag.textContent = '📝';
          descTag.title = 'Tem descrição — clique na tarefa para ver';
          tagsWrap.appendChild(descTag);
        }

        if(selectedCategory === 'all'){
          const catTag = document.createElement('span');
          catTag.className = 'task-cat';
          catTag.textContent = task.category || 'Geral';
          tagsWrap.appendChild(catTag);
        }

        if(task.pasta && viewMode !== 'pasta'){
          const pastaTag = document.createElement('span');
          pastaTag.className = 'task-pasta';
          pastaTag.textContent = task.pasta;
          tagsWrap.appendChild(pastaTag);
        }

        if(task.diasAtivos){
          const diasTag = document.createElement('span');
          diasTag.className = 'task-dias';
          diasTag.textContent = task.diasAtivos.map(d => 'DSTQQSS'[d]).join(' ');
          tagsWrap.appendChild(diasTag);
        }

        if(task.regime){
          const regimeTag = document.createElement('span');
          regimeTag.className = 'task-regime';
          regimeTag.textContent = task.regime === 'integral' ? 'Integral' : 'Meio período';
          tagsWrap.appendChild(regimeTag);
        }

        if(tagsWrap.children.length > 0) li.appendChild(tagsWrap);

        function abrirOuFecharEdicao(comFoco){
          const estaAbrindo = expandedTaskId !== task.id;
          expandedTaskId = estaAbrindo ? task.id : null;
          if(estaAbrindo && comFoco) focarCampoDeNomeAoAbrir = true;
          render();
        }

        const actionsWrap = document.createElement('div');
        actionsWrap.className = 'task-actions';

        const pinBtn = document.createElement('button');
        pinBtn.className = 'pin-btn' + (task.pinned ? ' active' : '');
        pinBtn.textContent = '📌';
        pinBtn.title = task.pinned ? 'Desafixar' : 'Fixar no topo';
        pinBtn.onclick = (e) => { e.stopPropagation(); togglePin(task.id); };
        actionsWrap.appendChild(pinBtn);

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = 'editar';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          abrirOuFecharEdicao(true);
        };
        actionsWrap.appendChild(editBtn);

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'remover';
        del.onclick = (e) => { e.stopPropagation(); deleteTask(task.id); };
        actionsWrap.appendChild(del);

        li.appendChild(actionsWrap);
        ul.appendChild(li);

        if(expandedTaskId === task.id){
          ul.appendChild(buildPastaPanel(task));
          if(task.freq === 'daily') ul.appendChild(buildDiasAtivosPanel(task));
          ul.appendChild(task.meta ? buildMetaPanel(task) : buildAddMetaPanel(task));
          ul.appendChild(buildDescricaoPanel(task));
        }
        // a descrição aberta pelo clique aparece acima dos mini-passos (no "editar"
        // ela já está no próprio painel de edição, então não duplica)
        if(subtasksOpenId === task.id && expandedTaskId !== task.id && comDescricao){
          ul.appendChild(buildDescricaoView(task));
        }
        // os mini-passos aparecem tanto no "editar" completo quanto no clique
        // direto na tarefa mãe — mas os dois não duplicam o painel se os dois
        // estiverem "abertos" ao mesmo tempo por acaso. Tarefa só com descrição
        // (sem passos) não mostra o painel de passos ao ser aberta pelo clique.
        if(expandedTaskId === task.id || (subtasksOpenId === task.id && temPassos)){
          ul.appendChild(buildSubtaskPanel(task, expandedTaskId === task.id));
        }
      });
    }

    section.appendChild(ul);
    container.appendChild(section);
  });

  if(focarCampoDeNomeAoAbrir){
    const campo = document.querySelector('.task-edit-input');
    if(campo){ campo.focus(); campo.select(); }
    focarCampoDeNomeAoAbrir = false;
  }

  if(focarSubtaskAoEditar){
    const campoSub = document.querySelector('.subtask-edit-input');
    if(campoSub){ campoSub.focus(); campoSub.select(); }
    focarSubtaskAoEditar = false;
  }

  if(telaAtual === 'grade') renderGrade();
}

// Painel de progresso da meta (aparece quando a tarefa tem meta e está
// expandida). É onde você atualiza o valor atual sem precisar mostrar
// a tarefa na lista o tempo todo.
function renomearTarefa(taskId, novoTexto){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const texto = novoTexto.trim();
  // nome não mudou: não faz nada. Antes sempre redesenhava a lista aqui, e como
  // esse campo perde o foco quando você clica em outro campo do "editar" (descrição,
  // pasta, meta...), o redesenho trocava o campo clicado por um novo e o clique se perdia.
  if(!texto || texto === task.text) return;
  task.text = texto; // se apagar tudo, mantém o nome antigo em vez de ficar em branco
  render();
  salvarTarefa(task);
}

// ---------- Descrição da tarefa ----------
// Uma tarefa pode ter uma descrição (o que precisa lembrar antes de fazer).
// Quando tem, clicar na linha da tarefa ABRE/FECHA a descrição em vez de
// marcar como feita (igual à tarefa mãe com passos); marcar passa a ser só
// pelo quadradinho da esquerda.
function temDescricao(task){
  return !!(task.descricao && task.descricao.trim());
}

// Salva a descrição. 'redesenhar' = false quando vem do blur do campo (redesenhar
// no meio de um clique no botão "salvar" faria o clique se perder).
function salvarDescricao(taskId, texto, redesenhar){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const novo = texto.trim();
  if((task.descricao || '') === novo) { if(redesenhar) render(); return; }
  task.descricao = novo;
  // sem descrição e sem passos, não há mais nada pra mostrar ao clicar
  if(!novo && !(task.subtasks && task.subtasks.length > 0) && subtasksOpenId === task.id){
    subtasksOpenId = null;
  }
  if(redesenhar) render();
  salvarTarefa(task);
}

// Painel do "editar": caixa de texto pra escrever a descrição
function buildDescricaoPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel descricao-edit';
  panel.onclick = (e) => e.stopPropagation();

  const label = document.createElement('div');
  label.className = 'meta-panel-row';
  label.textContent = 'descrição (aparece ao clicar na tarefa):';
  panel.appendChild(label);

  const area = document.createElement('textarea');
  area.className = 'descricao-input';
  area.rows = 4;
  area.placeholder = 'O que você precisa lembrar antes de fazer essa tarefa...';
  area.value = task.descricao || '';
  area.addEventListener('blur', () => salvarDescricao(task.id, area.value, false));
  panel.appendChild(area);

  const row = document.createElement('div');
  row.className = 'meta-panel-row';
  const salvarBtn = document.createElement('button');
  salvarBtn.textContent = 'salvar descrição';
  salvarBtn.onclick = () => salvarDescricao(task.id, area.value, true);
  row.appendChild(salvarBtn);
  panel.appendChild(row);
  return panel;
}

// Coloca o texto dentro do elemento, transformando endereços http(s) em links
function textoComLinks(container, texto){
  texto.split(/(https?:\/\/[^\s]+)/g).forEach(parte => {
    if(/^https?:\/\//.test(parte)){
      const a = document.createElement('a');
      a.href = parte;
      a.textContent = parte;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      container.appendChild(a);
    }else{
      container.appendChild(document.createTextNode(parte));
    }
  });
}

// Painel de leitura: a descrição que abre ao clicar na tarefa
function buildDescricaoView(task){
  const panel = document.createElement('li');
  panel.className = 'descricao-panel';
  panel.onclick = (e) => e.stopPropagation();
  const texto = document.createElement('div');
  texto.className = 'descricao-texto';
  textoComLinks(texto, task.descricao);
  panel.appendChild(texto);
  return panel;
}

function moverTarefaParaPasta(taskId, novoNome){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const nome = novoNome.trim();
  task.pasta = nome || null; // vazio = "sem pasta"
  render();
  salvarTarefa(task);
}

// Painel pra mudar a pasta de uma tarefa já existente, sem precisar
// recriá-la. Aparece sempre que a tarefa está expandida, junto com
// os outros painéis (meta / mini-passos).
function buildPastaPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'pasta: ' + (task.pasta || 'nenhuma') + ' →';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'text';
  input.setAttribute('list', 'pastaOptions');
  input.placeholder = 'nova pasta (vazio = remover)';
  input.value = task.pasta || '';
  row.appendChild(input);

  const moverBtn = document.createElement('button');
  moverBtn.textContent = 'mover';
  moverBtn.onclick = () => moverTarefaParaPasta(task.id, input.value);
  row.appendChild(moverBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') moverTarefaParaPasta(task.id, input.value);
  });

  panel.appendChild(row);
  return panel;
}

function toggleDiaAtivo(taskId, dia){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const diasAtuais = task.diasAtivos ? [...task.diasAtivos] : [0,1,2,3,4,5,6];
  const dias = diasAtuais.includes(dia)
    ? diasAtuais.filter(d => d !== dia)
    : [...diasAtuais, dia].sort();
  task.diasAtivos = (dias.length === 7) ? null : dias; // 7 de 7 = "todo dia", volta ao padrão
  render();
  salvarTarefa(task);
}

// Painel pra mudar em quais dias da semana uma tarefa DIÁRIA já existente
// realmente vale (ex: academia que não abre domingo).
function buildDiasAtivosPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'dias ativos:';
  row.appendChild(label);

  const diasAtuais = task.diasAtivos || [0,1,2,3,4,5,6];
  const letras = 'DSTQQSS';
  for(let dia = 0; dia < 7; dia++){
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (diasAtuais.includes(dia) ? ' active' : '');
    btn.textContent = letras[dia];
    btn.onclick = () => toggleDiaAtivo(task.id, dia);
    row.appendChild(btn);
  }

  panel.appendChild(row);
  return panel;
}

function buildMetaPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'valor atual:';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '0.01';
  input.value = task.meta.atual;
  row.appendChild(input);

  const metaLabel = document.createElement('span');
  metaLabel.textContent = '/ meta: ' + task.meta.alvo.toLocaleString('pt-BR');
  row.appendChild(metaLabel);

  const salvarBtn = document.createElement('button');
  salvarBtn.textContent = 'salvar';
  salvarBtn.onclick = () => atualizarMeta(task.id, input.value);
  row.appendChild(salvarBtn);

  const removerBtn = document.createElement('button');
  removerBtn.textContent = 'remover meta';
  removerBtn.onclick = () => removerMeta(task.id);
  row.appendChild(removerBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') atualizarMeta(task.id, input.value);
  });

  panel.appendChild(row);

  if(metaAtingida(task)){
    const okMsg = document.createElement('div');
    okMsg.className = 'period-label';
    okMsg.style.marginTop = '8px';
    okMsg.textContent = '✓ meta batida — já dá pra marcar a tarefa como concluída';
    panel.appendChild(okMsg);
  }

  return panel;
}

// Painel de mini-passos (aparece só quando a tarefa está expandida).
// É uma <li> separada, de bloco inteiro, em vez de ficar espremida na
// linha de flex da tarefa.
function buildSubtaskPanel(task, modoEdicaoCompleta){
  const panel = document.createElement('li');
  panel.className = 'subtask-panel';
  panel.onclick = (e) => e.stopPropagation(); // clicar aqui dentro não deve fechar o painel

  if(!task.subtasks) task.subtasks = [];

  if(task.subtasks.length === 0){
    // Ainda não existe nenhum passo: este é o momento de "criação" do
    // pipeline, e é a ÚNICA vez que essa escolha aparece. Depois que o
    // primeiro passo for adicionado, esse controle some — o valor fica
    // fixo (só dá pra mudar apagando os passos e recomeçando do zero).
    const seqRow = document.createElement('label');
    seqRow.className = 'seq-toggle';
    const seqCheckbox = document.createElement('input');
    seqCheckbox.type = 'checkbox';
    seqCheckbox.checked = !!task.sequential;
    seqCheckbox.onchange = () => toggleSequential(task.id);
    seqRow.appendChild(seqCheckbox);
    seqRow.appendChild(document.createTextNode(' ordem sequencial (só deixa marcar o próximo passo) — escolha antes de adicionar o 1º passo'));
    panel.appendChild(seqRow);
  } else {
    task.subtasks.forEach((sub, i) => {
      const bloqueado = task.sequential && !sub.done && task.subtasks.slice(0, i).some(s => !s.done);

      const row = document.createElement('div');
      row.className = 'subtask-row' + (bloqueado ? ' locked' : '');

      const cb = document.createElement('div');
      cb.className = 'sub-check' + (sub.done ? ' done' : '');
      cb.textContent = sub.done ? '✓' : '';

      const delSub = document.createElement('button');
      delSub.className = 'del';
      delSub.textContent = 'x';
      delSub.onclick = (e) => { e.stopPropagation(); deleteSubtask(task.id, sub.id); };

      if(!bloqueado){
        // clicar em qualquer parte da linha marca/desmarca — não só no
        // quadradinho — igual já funciona nas tarefas mãe
        row.onclick = () => toggleSubtask(task.id, sub.id);
        row.style.cursor = 'pointer';
      }

      const label = document.createElement('span');
      if(modoEdicaoCompleta && editingSubtaskId === sub.id){
        const inputEdicao = document.createElement('input');
        inputEdicao.type = 'text';
        inputEdicao.className = 'subtask-edit-input';
        inputEdicao.value = sub.text;
        inputEdicao.maxLength = 80;
        inputEdicao.onclick = (e) => e.stopPropagation();
        inputEdicao.addEventListener('blur', () => renomearSubtask(task.id, sub.id, inputEdicao.value));
        inputEdicao.addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){ e.preventDefault(); inputEdicao.blur(); }
          if(e.key === 'Escape'){ editingSubtaskId = null; render(); }
        });
        row.appendChild(cb);
        row.appendChild(inputEdicao);
        row.appendChild(delSub);
        panel.appendChild(row);
        return; // já montou essa linha em modo edição, pula o resto do loop
      }
      label.className = 'sub-text' + (sub.done ? ' done' : '');
      label.textContent = sub.text;
      if(bloqueado) label.style.cursor = 'default';

      row.appendChild(cb);
      row.appendChild(label);

      if(modoEdicaoCompleta){
        // renomear virou um botão próprio, já que clicar na linha agora marca/desmarca
        const editSubBtn = document.createElement('button');
        editSubBtn.className = 'edit-btn';
        editSubBtn.textContent = 'editar';
        editSubBtn.onclick = (e) => {
          e.stopPropagation();
          editingSubtaskId = sub.id;
          focarSubtaskAoEditar = true;
          render();
        };
        row.appendChild(editSubBtn);
      }

      row.appendChild(delSub);
      panel.appendChild(row);
    });
  }

  if(modoEdicaoCompleta){
    const addRow = document.createElement('div');
    addRow.className = 'add-subtask-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Novo passo...';
    input.maxLength = 80;
    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    const submeter = () => {
      addSubtask(task.id, input.value);
      input.value = '';
    };
    addBtn.onclick = submeter;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submeter(); });
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    panel.appendChild(addRow);
  }

  return panel;
}

// ---------- Persistência via Firestore ----------
// ANTES: um documento único "usuarios/<uid>" guardava um campo "tasks"
// com o array INTEIRO. Toda alteração reenviava tudo, e se alguma aba
// tivesse uma cópia desatualizada na memória (ex: aba em segundo plano
// por muito tempo), ela podia sobrescrever o array inteiro com dados
// velhos, apagando mudanças novas de qualquer outro dispositivo.
//
// AGORA: cada tarefa é o SEU PRÓPRIO documento, dentro de
// "usuarios/<uid>/tarefas/<idDaTarefa>". Uma escrita só mexe no
// documento daquela tarefa específica — uma aba desatualizada, na
// pior das hipóteses, só estraga a tarefa que ela mesma tocou por
// último, nunca mais a lista inteira.

// Salva várias tarefas de uma vez (e apaga outras) numa única operação
// atômica — usado pelas rotinas de manutenção (atrasadas, reset de
// pipeline/meta, limpeza de únicas), que podem mexer em mais de uma
// tarefa ao mesmo tempo.
async function salvarVariasTarefas(tarefasParaSalvar, idsParaApagar){
  if(!currentUser) return;
  if(tarefasParaSalvar.length === 0 && idsParaApagar.length === 0) return;
  try{
    document.getElementById('syncStatus').textContent = 'salvando...';
    const batch = writeBatch(db);
    tarefasParaSalvar.forEach(t => batch.set(doc(tarefasColRef(), t.id), t));
    idsParaApagar.forEach(id => batch.delete(doc(tarefasColRef(), id)));
    await batch.commit();
  }catch(e){
    console.error('Falha ao salvar em lote', e);
    document.getElementById('syncStatus').textContent = 'erro ao salvar';
  }
}

// ---------- Mini-passos (pipeline) dentro de uma tarefa ----------

function addSubtask(taskId, text){
  const t = text.trim();
  if(!t) return;
  const task = tasks.find(x => x.id === taskId);
  if(!task) return;
  if(!task.subtasks) task.subtasks = [];
  task.subtasks.push({
    id: 's' + Date.now() + Math.random().toString(36).slice(2,6),
    text: t,
    done: false
  });
  task.cycleKey = currentKey(task.freq); // marca a que período este progresso pertence
  render();
  salvarTarefa(task);
}

function deleteSubtask(taskId, subId){
  const task = tasks.find(x => x.id === taskId);
  if(!task || !task.subtasks) return;
  task.subtasks = task.subtasks.filter(s => s.id !== subId);
  // sem nenhum passo restante, a escolha de "ordem sequencial" volta ao
  // zero — do contrário o checkbox reaparecia marcado com o valor antigo
  if(task.subtasks.length === 0){
    task.sequential = false;
    // fecha o painel de passos aberto pelo clique na tarefa mãe: sem passos, ele
    // só mostraria o checkbox de "ordem sequencial" solto, e como a tarefa deixa
    // de ser "pipeline", clicar nela passaria a marcar como feita em vez de fechar
    if(subtasksOpenId === task.id) subtasksOpenId = null;
  }
  // recalcula se a tarefa mãe deve ficar marcada como concluída
  const todosFeitos = task.subtasks.length > 0 && task.subtasks.every(s => s.done);
  task.doneKey = todosFeitos ? currentKey(task.freq) : null;
  if(isDone(task)) task.missed = false;
  render();
  salvarTarefa(task);
}

function renomearSubtask(taskId, subId, novoTexto){
  const task = tasks.find(x => x.id === taskId);
  if(!task || !task.subtasks) return;
  const sub = task.subtasks.find(s => s.id === subId);
  if(!sub) return;
  const texto = novoTexto.trim();
  if(texto) sub.text = texto; // se apagar tudo, mantém o texto antigo
  editingSubtaskId = null;
  render();
  salvarTarefa(task);
}

function toggleSubtask(taskId, subId){
  const task = tasks.find(x => x.id === taskId);
  if(!task || !task.subtasks) return;
  const idx = task.subtasks.findIndex(s => s.id === subId);
  if(idx === -1) return;
  const sub = task.subtasks[idx];

  if(task.sequential && !sub.done){
    // no modo sequencial, só deixa marcar se todos os passos anteriores já estiverem feitos
    const temPendenteAntes = task.subtasks.slice(0, idx).some(s => !s.done);
    if(temPendenteAntes) return;
  }

  if(task.sequential && sub.done){
    // desmarcando um passo no modo sequencial: desmarca também os que vêm depois,
    // pra não deixar um passo "concluído" com um anterior pendente
    for(let i = idx; i < task.subtasks.length; i++) task.subtasks[i].done = false;
  } else {
    sub.done = !sub.done;
  }

  task.cycleKey = currentKey(task.freq);
  const todosFeitos = task.subtasks.every(s => s.done);
  task.doneKey = todosFeitos ? currentKey(task.freq) : null;
  if(isDone(task)) task.missed = false;

  render();
  salvarTarefa(task);
}

function toggleSequential(taskId){
  const task = tasks.find(x => x.id === taskId);
  if(!task) return;
  task.sequential = !task.sequential;
  render();
  salvarTarefa(task);
}

// Troca a tarefa de posição dentro do grupo em que ela está sendo exibida
// no momento — usa getGroupsToRender() pra "ver" exatamente a mesma lista
// que está na tela, seja agrupado por Frequência ou por Pasta.
// Como cada tarefa agora é um documento separado, a ordem entre elas
// precisa ser um CAMPO salvo (não dá mais pra confiar só na posição
// dentro do array) — por isso aqui a gente troca o campo "ordem" das
// duas tarefas envolvidas.
function moveTask(id, dir){
  const grupos = getGroupsToRender();
  const grupoDaTarefa = grupos.find(g => g.tasksInGroup.some(t => t.id === id));
  if(!grupoDaTarefa) return;

  const visivelNoGrupo = grupoDaTarefa.tasksInGroup;
  const pos = visivelNoGrupo.findIndex(t => t.id === id);
  const novaPos = pos + dir;
  if(novaPos < 0 || novaPos >= visivelNoGrupo.length) return;

  const tarefaA = visivelNoGrupo[pos];
  const tarefaB = visivelNoGrupo[novaPos];
  const ordemA = tarefaA.ordem || 0;
  const ordemB = tarefaB.ordem || 0;
  tarefaA.ordem = ordemB;
  tarefaB.ordem = ordemA;

  // também troca a posição no array local, pra tela atualizar na hora,
  // sem esperar o Firestore confirmar e mandar de volta
  const i1 = tasks.findIndex(t => t.id === tarefaA.id);
  const i2 = tasks.findIndex(t => t.id === tarefaB.id);
  [tasks[i1], tasks[i2]] = [tasks[i2], tasks[i1]];

  render();
  salvarVariasTarefas([tarefaA, tarefaB], []);
}

function addTask(){
  const input = document.getElementById('newTaskText');
  const catInput = document.getElementById('newTaskCategory');
  const pastaInput = document.getElementById('newTaskPasta');
  const regimeInput = document.getElementById('newTaskRegime');
  const temMetaInput = document.getElementById('newTaskTemMeta');
  const metaAlvoInput = document.getElementById('newTaskMetaAlvo');
  const text = input.value.trim();
  if(!text) return;
  const category = catInput.value.trim() || 'Geral';
  const pasta = pastaInput.value.trim() || null; // pasta é opcional, sem valor padrão "Geral"
  // regime só é considerado quando a categoria é "Trabalho" — mesma regra
  // que decide se o seletor aparece na tela, pra não salvar um valor que
  // ficou escondido/esquecido de uma digitação anterior
  const regime = (category.toLowerCase() === 'trabalho' && regimeInput.value) ? regimeInput.value : null;
  const alvoDigitado = Number(metaAlvoInput.value);
  const meta = (temMetaInput.checked && alvoDigitado > 0) ? { alvo: alvoDigitado, atual: 0 } : null;
  // dias ativos só faz sentido pra tarefas diárias; null = "todo dia" (padrão)
  const diasAtivos = (selectedFreq === 'daily' && diasSelecionados.size < 7)
    ? Array.from(diasSelecionados).sort()
    : null;
  // nova tarefa entra no fim da lista — maior "ordem" existente + 1
  const maiorOrdem = tasks.reduce((max, t) => Math.max(max, t.ordem || 0), 0);
  const novaTarefa = {
    id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
    text: text,
    category: category,
    pasta: pasta,
    regime: regime,
    meta: meta,
    diasAtivos: diasAtivos,
    freq: selectedFreq,
    doneKey: null,
    ordem: maiorOrdem + 1
  };
  tasks.push(novaTarefa);
  input.value = '';
  catInput.value = '';
  pastaInput.value = '';
  regimeInput.value = '';
  temMetaInput.checked = false;
  metaAlvoInput.value = '';
  resetarDiaPicker();
  atualizarVisibilidadeMeta();
  atualizarVisibilidadeRegime();
  render();
  salvarTarefa(novaTarefa);
}

    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Tente entrar em vez de criar conta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.'
  };
  loginError.textContent = mapa[codigo] || ('Erro: ' + (e.message || 'algo deu errado'));
}

document.getElementById('btnEntrar').onclick = async () => {
  loginError.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;

    await signInWithEmailAndPassword(auth, email, senha);
  }catch(e){ mostrarErro(e); }
};

// ---------- Atalhos do ícone do app (manifest.json → "shortcuts") ----------
// Segurar o ícone do Rotina abre o app com um parâmetro no endereço, por exemplo
// "?tela=grade" ou "?acao=nova". Aqui a gente lê esse parâmetro e age.
let abrirNovaTarefaAoEntrar = false;
let abrirVozAoEntrar = false;
(function aplicarAtalhoDoEndereco(){
  const params = new URLSearchParams(location.search);
  const tela = params.get('tela');
  const acao = params.get('acao');
  if(!tela && !acao) return;

  // ?tela=lista | grade | calendario → "clica" no botão da aba correspondente
  if(tela){
    const botao = document.querySelector('.tela-btn[data-tela="' + tela + '"]');
    if(botao) botao.click();
  }
  // ?acao=nova → depois do login, leva o cursor pro campo "Nova tarefa..."
  if(acao === 'nova') abrirNovaTarefaAoEntrar = true;
  // ?acao=voz → depois do login, abre o painel de criar por voz já ouvindo
  if(acao === 'voz') abrirVozAoEntrar = true;

  // limpa o endereço pra um refresh (F5) não repetir o atalho
  history.replaceState(null, '', location.pathname);
})();

onAuthStateChanged(auth, async (user) => {
  setCurrentUser(user);
  if(user){
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    if(abrirVozAoEntrar){
      abrirVozAoEntrar = false;
      abrirVoz(true);
    }
    if(abrirNovaTarefaAoEntrar){
      abrirNovaTarefaAoEntrar = false;
      const campo = document.getElementById('newTaskText');
      campo.scrollIntoView({ block: 'center' });
      campo.focus();
    }
    document.getElementById('accountEmail').textContent = user.email;
    renderTodayLabel();
    try{
      await migrarDadosAntigosSeNecessario();
    }catch(e){
      console.error('Falha ao migrar dados antigos', e);
    }
    comecarAEscutarDados({
      setTasks, setBlocos, setEventos, setCurrentMode,
      render, renderGrade, renderCalendario,
      checkMissedTasks, cleanupOnceTasks, resetExpiredPipelines,
      salvarVariasTarefas
    });
  } else {
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    pararDeEscutar();
    tasks = [];
  }
});
</script>

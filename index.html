<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotina</title>
<style>
  :root{
    --bg: #F5F2EA;
    --paper: #FBF9F3;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --rule: #DCD5C4;
    --margin: #B4483C;

    --daily: #1D9E75;
    --daily-ink: #04342C;
    --daily-bg: #E1F5EE;

    --weekly: #BA7517;
    --weekly-ink: #412402;
    --weekly-bg: #FAEEDA;

    --monthly: #534AB7;
    --monthly-ink: #26215C;
    --monthly-bg: #EEEDFE;

    --once: #5F5E5A;
    --once-ink: #2C2C2A;
    --once-bg: #F1EFE8;

    --pasta: #1D6FA5;
    --pasta-ink: #0A2E42;
    --pasta-bg: #DCEFFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 16px 80px;
  }
  .page{
    max-width: 720px;
    margin: 0 auto;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  h1{
    font-size: 30px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .today{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align:right;
  }

  /* ---- Tela de login ---- */
  .login-wrap{
    max-width: 360px;
    margin: 60px auto;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ink);
    padding: 28px 24px;
  }
  .login-wrap h1{
    margin-bottom: 4px;
  }
  .login-sub{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .login-wrap input{
    width: 100%;
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
    margin-bottom: 10px;
  }
  .login-btns{
    display:flex;
    gap: 8px;
    margin-top: 6px;
  }
  .login-btns button{
    flex:1;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px;
    border: 1px solid var(--ink);
    cursor: pointer;
    border-radius: 3px;
  }
  #btnEntrar{ background: var(--ink); color: var(--paper); }
  #btnEntrar:hover{ background: #423B32; }
  #btnCriarConta{ background: #fff; color: var(--ink); }
  #btnCriarConta:hover{ background: var(--bg); }
  .login-error{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--margin);
    margin-top: 10px;
    min-height: 16px;
  }
  .account-bar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .account-bar button{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: none;
    border: 1px solid var(--rule);
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 3px;
    color: var(--ink-soft);
  }
  .account-bar button:hover{ color: var(--margin); border-color: var(--margin); }
  .sync-status{
    font-style: italic;
  }

  .add-box{
    background: var(--paper);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ink);
    padding: 14px 16px;
    margin-bottom: 28px;
  }
  .add-row{
    display:flex;
    gap:8px;
    flex-wrap: wrap;
  }
  .add-row input[type=text]{
    flex: 1 1 220px;
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
  }
  .add-row input[type=text]:focus{
    outline: none;
    border-color: var(--ink);
  }
  .freq-picker{
    display:flex;
    gap: 6px;
  }
  .freq-btn{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 3px;
  }
  .freq-btn.active[data-freq="daily"]{ background: var(--daily-bg); border-color: var(--daily); color: var(--daily-ink); }
  .freq-btn.active[data-freq="weekly"]{ background: var(--weekly-bg); border-color: var(--weekly); color: var(--weekly-ink); }
  .freq-btn.active[data-freq="monthly"]{ background: var(--monthly-bg); border-color: var(--monthly); color: var(--monthly-ink); }
  .freq-btn.active[data-freq="once"]{ background: var(--once-bg); border-color: var(--once); color: var(--once-ink); }

  .day-picker{
    display:flex;
    gap: 4px;
  }
  .day-picker.hidden{ display:none; }
  .day-btn{
    width: 26px;
    height: 30px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 3px;
  }
  .day-btn.active{
    background: var(--daily-bg);
    border-color: var(--daily);
    color: var(--daily-ink);
  }

  .add-submit{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    border-radius: 3px;
  }
  .add-submit:hover{ background: #423B32; }

  .add-row input#newTaskCategory{
    flex: 0 1 160px;
  }

  .cat-bar{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 22px;
  }
  .cat-chip{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 20px;
  }
  .cat-chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .task-cat{
    flex: none;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    padding: 2px 6px;
    border-radius: 10px;
  }
  .task-regime{
    flex: none;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--margin);
    border: 1px solid var(--margin);
    padding: 2px 6px;
    border-radius: 10px;
  }
  .task-pasta{
    flex: none;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--pasta);
    border: 1px solid var(--pasta);
    padding: 2px 6px;
    border-radius: 10px;
  }
  .task-dias{
    flex: none;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--daily-ink);
    border: 1px solid var(--daily);
    padding: 2px 6px;
    border-radius: 10px;
  }

  .day-toggle-panel{
    display:flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .mode-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 22px;
    padding: 10px 14px;
    background: var(--paper);
    border: 1px solid var(--rule);
  }
  .mode-label{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
  }
  .mode-btn{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 3px;
  }
  .mode-btn.active{
    background: var(--margin);
    border-color: var(--margin);
    color: #fff;
  }

  #newTaskRegime{
    flex: 0 1 150px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
  }

  .meta-toggle-label{
    display:flex;
    align-items:center;
    gap: 4px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  #newTaskMetaAlvo{
    flex: 0 1 120px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
  }

  .check.meta-locked{
    width: auto;
    min-width: 20px;
    padding: 0 6px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    background: var(--once-bg);
    border-color: var(--once);
    color: var(--once-ink);
    cursor: default;
  }
  ul.tasks li.meta-bloqueada{
    opacity: 0.6;
  }

  li.meta-panel{
    display:block;
    cursor: default;
    background: var(--bg);
    padding: 12px 14px 14px 44px;
    border-bottom: 1px dashed var(--rule);
  }
  .meta-panel-row{
    display:flex;
    align-items:center;
    gap: 8px;
    flex-wrap: wrap;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .meta-panel-row input{
    width: 110px;
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--rule);
    background: #fff;
    border-radius: 3px;
  }
  .meta-panel-row button{
    font-family: 'Courier New', monospace;
    padding: 6px 12px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-radius: 3px;
    cursor: pointer;
  }

  section.group{
    margin-bottom: 26px;
  }
  .group-head{
    display:flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .tab{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 3px;
  }
  .tab.daily{ background: var(--daily-bg); color: var(--daily-ink); }
  .tab.weekly{ background: var(--weekly-bg); color: var(--weekly-ink); }
  .tab.monthly{ background: var(--monthly-bg); color: var(--monthly-ink); }
  .tab.once{ background: var(--once-bg); color: var(--once-ink); }
  .tab.pasta{ background: var(--pasta-bg); color: var(--pasta-ink); }

  .pasta-action{
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: none;
    border: 1px solid var(--rule);
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .pasta-action:hover{ color: var(--ink); border-color: var(--ink); }

  .period-label{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .progress{
    margin-left: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  ul.tasks{
    list-style:none;
    margin:0;
    padding:0;
    background: var(--paper);
    border: 1px solid var(--rule);
  }
  ul.tasks li{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px dashed var(--rule);
  }
  ul.tasks li:last-child{ border-bottom:none; }
  ul.tasks li.empty{
    color: var(--ink-soft);
    font-style: italic;
    font-size: 14px;
    cursor: default;
  }
  ul.tasks li.missed{
    box-shadow: inset 0 0 0 2px var(--margin);
  }

  .check{
    width: 20px;
    height: 20px;
    flex: none;
    border: 1.5px solid var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #fff;
  }
  .check.done{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
    font-size: 13px;
  }
  .task-text{
    flex:1;
    font-size: 15.5px;
  }
  .task-text.done{
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .del{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
  }
  .del:hover{ color: var(--margin); }

  .edit-btn{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
  }
  .edit-btn:hover{ color: var(--ink); }

  .move-btns{
    display:flex;
    flex-direction: column;
    gap: 2px;
    flex: none;
    opacity: 0;
    pointer-events: none;
    width: 0;
    overflow: hidden;
    transition: opacity 0.15s;
  }
  ul.tasks li.expanded .move-btns{
    opacity: 1;
    pointer-events: auto;
    width: 18px;
    overflow: visible;
  }
  .move-btn{
    width: 18px;
    height: 14px;
    line-height: 14px;
    font-size: 9px;
    padding: 0;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 2px;
  }
  .move-btn:hover{ background: var(--bg); color: var(--ink); }
  .move-btn:disabled{ opacity: 0.25; cursor: default; }
  .move-btn:disabled:hover{ background: #fff; color: var(--ink-soft); }

  .pipeline-badge{
    width: auto;
    min-width: 20px;
    padding: 0 6px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
  }

  li.subtask-panel{
    display: block;
    cursor: default;
    background: var(--bg);
    padding: 12px 14px 14px 44px;
    border-bottom: 1px dashed var(--rule);
  }

  @media (max-width: 480px){
    li.subtask-panel{
      padding-left: 22px;
    }
  }

  .seq-toggle{
    display:flex;
    align-items:center;
    gap: 6px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    cursor: pointer;
  }

  .subtask-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 6px 0;
  }
  .subtask-row.locked{
    opacity: 0.4;
  }
  .sub-check{
    width: 16px;
    height: 16px;
    flex: none;
    border: 1.5px solid var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #fff;
    font-size: 10px;
  }
  .subtask-row.locked .sub-check{ cursor: default; }
  .sub-check.done{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .sub-text{
    flex:1;
    min-width: 0; /* sem isso, o flexbox não deixa o texto encolher — ele empurra
                     a linha toda pra fora da tela em vez de quebrar pra baixo */
    font-size: 14px;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .sub-text.done{
    color: var(--ink-soft);
    text-decoration: line-through;
  }

  .add-subtask-row{
    display:flex;
    gap: 6px;
    margin-top: 8px;
  }
  .add-subtask-row input{
    flex:1;
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--rule);
    background: #fff;
    border-radius: 3px;
  }
  .add-subtask-row button{
    font-family: 'Courier New', monospace;
    padding: 6px 12px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-radius: 3px;
    cursor: pointer;
  }

  .loading, .save-msg{
    text-align:center;
    color: var(--ink-soft);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 20px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div class="login-wrap" id="loginScreen">
  <h1>Rotina</h1>
  <div class="login-sub">entre com o mesmo e-mail e senha em todos os seus dispositivos</div>
  <input type="email" id="loginEmail" placeholder="seu e-mail" autocomplete="email">
  <input type="password" id="loginSenha" placeholder="sua senha (mínimo 6 caracteres)" autocomplete="current-password">
  <div class="login-btns">
    <button id="btnEntrar">Entrar</button>
    <button id="btnCriarConta">Criar conta</button>
  </div>
  <div class="login-error" id="loginError"></div>
</div>

<!-- ===== APP PRINCIPAL ===== -->
<div class="page hidden" id="appScreen">
  <header>
    <h1>Rotina</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="account-bar">
    <span id="accountEmail"></span>
    <span class="sync-status" id="syncStatus"></span>
    <button id="btnSair">Sair</button>
  </div>

  <div class="mode-bar" id="modeBar">
    <span class="mode-label">Modo atual:</span>
    <button class="mode-btn" data-mode="meio">Meio período</button>
    <button class="mode-btn" data-mode="integral">Integral</button>
    <button class="mode-btn" data-mode="ambos">Ambos</button>
  </div>

  <div class="mode-bar" id="viewBar">
    <span class="mode-label">Ver por:</span>
    <button class="mode-btn" data-view="freq">Frequência</button>
    <button class="mode-btn" data-view="pasta">Pasta</button>
  </div>

  <div class="mode-bar" id="metaBar">
    <span class="mode-label">Bloqueadas por meta:</span>
    <button class="mode-btn" data-showblocked="false">Escondidas</button>
    <button class="mode-btn" data-showblocked="true">Mostrar</button>
  </div>

  <div class="add-box">
    <div class="add-row">
      <input type="text" id="newTaskText" placeholder="Nova tarefa..." maxlength="120">
      <input type="text" id="newTaskCategory" placeholder="Categoria (ex: Faculdade)" maxlength="40" list="categoryOptions">
      <datalist id="categoryOptions"></datalist>
      <input type="text" id="newTaskPasta" placeholder="Pasta (opcional)" maxlength="40" list="pastaOptions">
      <datalist id="pastaOptions"></datalist>
      <select id="newTaskRegime" class="hidden">
        <option value="">Regime: nenhum</option>
        <option value="meio">Regime: meio período</option>
        <option value="integral">Regime: integral</option>
      </select>
      <label class="meta-toggle-label">
        <input type="checkbox" id="newTaskTemMeta"> tem meta?
      </label>
      <input type="number" id="newTaskMetaAlvo" placeholder="Meta (ex: 8000)" class="hidden" min="0" step="0.01">
      <div class="freq-picker" id="freqPicker">
        <button class="freq-btn active" data-freq="daily">Diária</button>
        <button class="freq-btn" data-freq="weekly">Semanal</button>
        <button class="freq-btn" data-freq="monthly">Mensal</button>
        <button class="freq-btn" data-freq="once">Única</button>
      </div>
      <div class="day-picker" id="dayPicker">
        <button class="day-btn active" data-day="0">D</button>
        <button class="day-btn active" data-day="1">S</button>
        <button class="day-btn active" data-day="2">T</button>
        <button class="day-btn active" data-day="3">Q</button>
        <button class="day-btn active" data-day="4">Q</button>
        <button class="day-btn active" data-day="5">S</button>
        <button class="day-btn active" data-day="6">S</button>
      </div>
      <button class="add-submit" id="addBtn">Adicionar</button>
    </div>
  </div>

  <div class="cat-bar" id="catBar"></div>
  <div id="groups"></div>
  <div class="loading" id="loadingMsg">carregando...</div>
</div>

<script type="module">
// ============================================================
// FIREBASE: importado direto por link (CDN), sem precisar de
// npm/Node.js. Isso é possível porque o SDK v9+ do Firebase é
// distribuído também como "ES module" hospedado no gstatic.com.
// ============================================================
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, setDoc, getDoc, deleteDoc, collection, writeBatch, onSnapshot

function pad(n){ return String(n).padStart(2,'0'); }
function dailyKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function weeklyKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const fDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7*86400000));
  return date.getUTCFullYear()+'-W'+pad(week);
}

function monthlyKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }

function currentKey(freq){
  const d = new Date();
  if(freq === 'daily') return dailyKey(d);
  if(freq === 'weekly') return weeklyKey(d);
  if(freq === 'monthly') return monthlyKey(d);
  return dailyKey(d);
}

function isDone(task){
  if(task.subtasks && task.subtasks.length > 0){
    return task.subtasks.every(s => s.done);
  }
  return task.doneKey === currentKey(task.freq);
}

function cleanupOnceTasks(){
  const today = dailyKey(new Date());
  const idsParaApagar = [];
  tasks = tasks.filter(t => {
    const expirou = t.freq === 'once' && t.doneKey && t.doneKey !== today;
    if(expirou) idsParaApagar.push(t.id);
    return !expirou;
  });
  return idsParaApagar;
}

// Dado um dailyKey ("2026-09-14"), devolve o dia da semana dele (0=domingo).
// Usado pra saber se uma tarefa diária com dias customizados (ex: academia,
// só de segunda a sábado) realmente "valia" naquele dia específico.
function weekdayFromDailyKey(key){
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

// Uma tarefa diária só é "esperada" num dia se esse dia estiver na lista de
// dias ativos dela. task.diasAtivos === null/undefined significa "todo dia"
// (comportamento original, continua valendo pras tarefas já existentes).
function diaEhAtivoParaTarefa(task, diaDaSemana){
  if(task.freq !== 'daily' || !task.diasAtivos) return true;
  return task.diasAtivos.includes(diaDaSemana);
}

// Marca como "atrasada" (missed) uma tarefa recorrente que virou a
// página do período (dia/semana/mês) sem ter sido concluída.
// IMPORTANTE: isso precisa rodar ANTES do resetExpiredPipelines(), porque
// aquela função zera o doneKey/subtasks do novo ciclo — e é justamente o
// doneKey do ciclo que ACABOU que usamos aqui pra saber se deu tempo ou não.
function checkMissedTasks(){
  const tarefasAlteradas = [];
  tasks.forEach(task => {
    if(task.freq === 'once') return; // tarefa única não tem "período" pra atrasar

    const key = currentKey(task.freq);

    if(task.lastEvaluatedKey === undefined){
      // primeira vez que vemos essa tarefa: só começa a contar a partir de agora,
      // pra não acusar atraso de um período que nem existia quando o app rodou essa checagem pela 1ª vez
      task.lastEvaluatedKey = key;
      tarefasAlteradas.push(task);
      return;
    }

    if(task.lastEvaluatedKey !== key){
      // o período anterior (task.lastEvaluatedKey) já terminou — mas só conta
      // como "perdido" se aquele dia era mesmo um dia em que a tarefa valia
      // (ex: não acusa academia de domingo, se domingo não está nos dias ativos)
      const diaAnteriorEraAtivo = task.freq !== 'daily'
        || diaEhAtivoParaTarefa(task, weekdayFromDailyKey(task.lastEvaluatedKey));

      if(diaAnteriorEraAtivo){
        const foiCumpridaNoPeriodoAnterior = task.doneKey === task.lastEvaluatedKey;
        if(!foiCumpridaNoPeriodoAnterior){
          task.missed = true;
        }
      }
      task.lastEvaluatedKey = key;
      tarefasAlteradas.push(task);
    }
  });
  return tarefasAlteradas;
}

// Tarefas recorrentes com mini-passos OU com meta: quando o período muda
// (ex: virou o mês), tanto os passos quanto o progresso da meta precisam
// reiniciar do zero, senão ficariam "colados" pra sempre no ciclo antigo.
function resetExpiredPipelines(){
  const tarefasAlteradas = [];
  tasks.forEach(task => {
    const temAlgoPraResetar = (task.subtasks && task.subtasks.length > 0) || task.meta;
    if(temAlgoPraResetar && task.freq !== 'once'){
      const key = currentKey(task.freq);
      if(task.cycleKey && task.cycleKey !== key){
        if(task.subtasks) task.subtasks.forEach(s => { s.done = false; });
        if(task.meta) task.meta.atual = 0;
        task.doneKey = null;
        task.cycleKey = key;
        tarefasAlteradas.push(task);
      }
    }
  });
  return tarefasAlteradas;
}

// Uma tarefa com meta só pode ser concluída depois que "atual" bate "alvo".
// Tarefas sem meta nenhuma sempre passam nessa checagem.
function metaAtingida(task){
  return !task.meta || task.meta.atual >= task.meta.alvo;
}

function atualizarMeta(taskId, novoValor){
  const task = tasks.find(t => t.id === taskId);
  if(!task || !task.meta) return;
  const valor = Number(novoValor);
  task.meta.atual = isNaN(valor) ? 0 : Math.max(0, valor);
  task.cycleKey = currentKey(task.freq);
  render();
  salvarTarefa(task);
}

const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WEEKDAYS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

function renderTodayLabel(){
  const d = new Date();
  document.getElementById('todayLabel').textContent =
    WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
}

function periodLabelFor(freq){
  const d = new Date();
  if(freq === 'daily') return 'hoje · ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
  if(freq === 'weekly') return 'esta semana';
  if(freq === 'monthly') return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  return 'sem prazo';
}

const GROUPS = [
  {freq:'daily', label:'Diárias'},
  {freq:'weekly', label:'Semanais'},
  {freq:'monthly', label:'Mensais'},
  {freq:'once', label:'Únicas'}
];

let viewMode = 'freq'; // 'freq' (padrão, por Diária/Semanal/...) ou 'pasta'
let showBlocked = false; // tarefas travadas por meta ficam escondidas por padrão

function getVisibleTasks(){
  const hoje = new Date().getDay();
  return tasks
    .filter(t => selectedCategory === 'all' || (t.category || 'Geral') === selectedCategory)
    .filter(t => currentMode === 'ambos' || !t.regime || t.regime === currentMode)
    .filter(t => showBlocked || metaAtingida(t))
    .filter(t => diaEhAtivoParaTarefa(t, hoje));
}

// Monta a lista de "grupos" a exibir, já com as tarefas de cada um dentro.
// Centralizar essa lógica aqui (em vez de espalhar em render() e moveTask())
// garante que os dois enxerguem exatamente os mesmos grupos, na mesma ordem.
function getGroupsToRender(){
  const visivel = getVisibleTasks();

  if(viewMode === 'pasta'){
    const nomesDePasta = Array.from(new Set(visivel.map(t => t.pasta || null)));
    nomesDePasta.sort((a, b) => {
      if(a === null) return 1;   // "Sem pasta" sempre por último
      if(b === null) return -1;
      return a.localeCompare(b, 'pt-BR');
    });
    return nomesDePasta.map(nome => ({
      type: 'pasta',
      pastaName: nome, // null pra "Sem pasta"
      label: nome || 'Sem pasta',
      tasksInGroup: visivel.filter(t => (t.pasta || null) === nome)
    }));
  }

  return GROUPS.map(g => ({
    type: 'freq',
    freq: g.freq,
    label: g.label,
    tasksInGroup: visivel.filter(t => t.freq === g.freq)
  }));
}

function distinctPastas(){
  const set = new Set(tasks.map(t => t.pasta).filter(Boolean));
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function renomearPasta(nomeAntigo){
  const novoNome = window.prompt('Novo nome da pasta:', nomeAntigo);
  if(novoNome === null) return; // cancelou
  const nome = novoNome.trim();
  if(!nome || nome === nomeAntigo) return;
  const afetadas = tasks.filter(t => (t.pasta || null) === nomeAntigo);
  afetadas.forEach(t => { t.pasta = nome; });
  render();
  salvarVariasTarefas(afetadas, []);
}

function desfazerPasta(nomePasta){
  const ok = window.confirm('Isso só solta as tarefas da pasta "' + nomePasta + '" — nenhuma tarefa é apagada. Continuar?');
  if(!ok) return;
  const afetadas = tasks.filter(t => (t.pasta || null) === nomePasta);
  afetadas.forEach(t => { t.pasta = null; });
  render();
  salvarVariasTarefas(afetadas, []);
}

function render(){
  renderCatBar();
  renderModeBar();
  renderViewBar();
  renderMetaBar();
  const container = document.getElementById('groups');
  container.innerHTML = '';

  const datalistPastas = document.getElementById('pastaOptions');
  datalistPastas.innerHTML = distinctPastas().map(p => '<option value="' + p.replace(/"/g,'') + '">').join('');

  getGroupsToRender().forEach(g => {
    const groupTasks = g.tasksInGroup;
    const doneCount = groupTasks.filter(isDone).length;

    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';

    const tabSpan = document.createElement('span');
    tabSpan.className = 'tab ' + (g.type === 'freq' ? g.freq : 'pasta');
    tabSpan.textContent = g.label;
    head.appendChild(tabSpan);

    if(g.type === 'freq'){
      const periodSpan = document.createElement('span');
      periodSpan.className = 'period-label';
      periodSpan.textContent = periodLabelFor(g.freq);
      head.appendChild(periodSpan);
    } else if(g.pastaName){
      const renameBtn = document.createElement('button');
      renameBtn.className = 'pasta-action';
      renameBtn.textContent = 'renomear';
      renameBtn.onclick = () => renomearPasta(g.pastaName);
      const desfazerBtn = document.createElement('button');
      desfazerBtn.className = 'pasta-action';
      desfazerBtn.textContent = 'desfazer pasta';
      desfazerBtn.onclick = () => desfazerPasta(g.pastaName);
      head.appendChild(renameBtn);
      head.appendChild(desfazerBtn);
    }

    const progressSpan = document.createElement('span');
    progressSpan.className = 'progress';
    progressSpan.textContent = doneCount + '/' + groupTasks.length;
    head.appendChild(progressSpan);

    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'tasks';

    if(groupTasks.length === 0){
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'nenhuma tarefa aqui ainda';
      ul.appendChild(li);
    } else {
      groupTasks.forEach((task, idx) => {
        const done = isDone(task);
        const li = document.createElement('li');
        const classes = [];
        if(expandedTaskId === task.id) classes.push('expanded');
        if(task.missed && !done) classes.push('missed');
        const bloqueadaPorMeta = task.meta && !metaAtingida(task);
        if(bloqueadaPorMeta) classes.push('meta-bloqueada');
        li.className = classes.join(' ');

        const moveBtns = document.createElement('div');
        moveBtns.className = 'move-btns';
        const upBtn = document.createElement('button');
        upBtn.className = 'move-btn';
        upBtn.textContent = '▲';
        upBtn.disabled = idx === 0;
        upBtn.onclick = (e) => { e.stopPropagation(); moveTask(task.id, -1); };
        const downBtn = document.createElement('button');
        downBtn.className = 'move-btn';
        downBtn.textContent = '▼';
        downBtn.disabled = idx === groupTasks.length - 1;
        downBtn.onclick = (e) => { e.stopPropagation(); moveTask(task.id, 1); };
        moveBtns.appendChild(upBtn);
        moveBtns.appendChild(downBtn);
        li.appendChild(moveBtns);

        const temPassos = task.subtasks && task.subtasks.length > 0;

        const check = document.createElement('div');
        if(bloqueadaPorMeta){
          // travada: mostra o progresso da meta no lugar do check, sem
          // dar pra marcar enquanto não bater o valor alvo
          check.className = 'check meta-locked';
          check.textContent = '🔒 ' + task.meta.atual.toLocaleString('pt-BR') + '/' + task.meta.alvo.toLocaleString('pt-BR');
        } else if(temPassos){
          const feitos = task.subtasks.filter(s => s.done).length;
          check.className = 'check pipeline-badge' + (done ? ' done' : '');
          check.textContent = feitos + '/' + task.subtasks.length;
        } else {
          check.className = 'check' + (done ? ' done' : '');
          check.textContent = done ? '✓' : '';
          check.onclick = (e) => { e.stopPropagation(); toggleTask(task.id); };
        }

        const textEl = document.createElement('span');
        textEl.className = 'task-text' + (done ? ' done' : '');
        textEl.textContent = task.text;

        li.appendChild(check);
        li.appendChild(textEl);

        if(selectedCategory === 'all'){
          const catTag = document.createElement('span');
          catTag.className = 'task-cat';
          catTag.textContent = task.category || 'Geral';
          li.appendChild(catTag);
        }

        if(task.pasta && viewMode === 'freq'){
          const pastaTag = document.createElement('span');
          pastaTag.className = 'task-pasta';
          pastaTag.textContent = task.pasta;
          li.appendChild(pastaTag);
        }

        if(task.diasAtivos){
          const diasTag = document.createElement('span');
          diasTag.className = 'task-dias';
          diasTag.textContent = task.diasAtivos.map(d => 'DSTQQSS'[d]).join(' ');
          li.appendChild(diasTag);
        }

        if(task.regime){
          const regimeTag = document.createElement('span');
          regimeTag.className = 'task-regime';
          regimeTag.textContent = task.regime === 'integral' ? 'Integral' : 'Meio período';
          li.appendChild(regimeTag);
        }

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = 'editar';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          expandedTaskId = (expandedTaskId === task.id) ? null : task.id;
          render();
        };
        li.appendChild(editBtn);

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'remover';
        del.onclick = (e) => { e.stopPropagation(); deleteTask(task.id); };
        li.appendChild(del);
        ul.appendChild(li);

        if(expandedTaskId === task.id){
          ul.appendChild(buildRenamePanel(task));
          ul.appendChild(buildPastaPanel(task));
          if(task.freq === 'daily') ul.appendChild(buildDiasAtivosPanel(task));
          if(task.meta) ul.appendChild(buildMetaPanel(task));
          ul.appendChild(buildSubtaskPanel(task));
        }
      });
    }

    section.appendChild(ul);
    container.appendChild(section);
  });
}

// Painel de progresso da meta (aparece quando a tarefa tem meta e está
// expandida). É onde você atualiza o valor atual sem precisar mostrar
// a tarefa na lista o tempo todo.
function renomearTarefa(taskId, novoTexto){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const texto = novoTexto.trim();
  if(texto) task.text = texto; // se apagar tudo, mantém o nome antigo em vez de ficar em branco
  render();
  salvarTarefa(task);
}

// Painel de renomear — primeira coisa que aparece ao clicar em "editar".
function buildRenamePanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'nome:';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'text';
  input.value = task.text;
  input.maxLength = 120;
  row.appendChild(input);

  const salvarBtn = document.createElement('button');
  salvarBtn.textContent = 'salvar';
  salvarBtn.onclick = () => renomearTarefa(task.id, input.value);
  row.appendChild(salvarBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') renomearTarefa(task.id, input.value);
  });

  panel.appendChild(row);
  return panel;
}

function moverTarefaParaPasta(taskId, novoNome){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const nome = novoNome.trim();
  task.pasta = nome || null; // vazio = "sem pasta"
  render();
  salvarTarefa(task);
}

// Painel pra mudar a pasta de uma tarefa já existente, sem precisar
// recriá-la. Aparece sempre que a tarefa está expandida, junto com
// os outros painéis (meta / mini-passos).
function buildPastaPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'pasta: ' + (task.pasta || 'nenhuma') + ' →';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'text';
  input.setAttribute('list', 'pastaOptions');
  input.placeholder = 'nova pasta (vazio = remover)';
  input.value = task.pasta || '';
  row.appendChild(input);

  const moverBtn = document.createElement('button');
  moverBtn.textContent = 'mover';
  moverBtn.onclick = () => moverTarefaParaPasta(task.id, input.value);
  row.appendChild(moverBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') moverTarefaParaPasta(task.id, input.value);
  });

  panel.appendChild(row);
  return panel;
}

function toggleDiaAtivo(taskId, dia){
  const task = tasks.find(t => t.id === taskId);
  if(!task) return;
  const diasAtuais = task.diasAtivos ? [...task.diasAtivos] : [0,1,2,3,4,5,6];
  const dias = diasAtuais.includes(dia)
    ? diasAtuais.filter(d => d !== dia)
    : [...diasAtuais, dia].sort();
  task.diasAtivos = (dias.length === 7) ? null : dias; // 7 de 7 = "todo dia", volta ao padrão
  render();
  salvarTarefa(task);
}

// Painel pra mudar em quais dias da semana uma tarefa DIÁRIA já existente
// realmente vale (ex: academia que não abre domingo).
function buildDiasAtivosPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'dias ativos:';
  row.appendChild(label);

  const diasAtuais = task.diasAtivos || [0,1,2,3,4,5,6];
  const letras = 'DSTQQSS';
  for(let dia = 0; dia < 7; dia++){
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (diasAtuais.includes(dia) ? ' active' : '');
    btn.textContent = letras[dia];
    btn.onclick = () => toggleDiaAtivo(task.id, dia);
    row.appendChild(btn);
  }

  panel.appendChild(row);
  return panel;
}

function buildMetaPanel(task){
  const panel = document.createElement('li');
  panel.className = 'meta-panel';
  panel.onclick = (e) => e.stopPropagation();

  const row = document.createElement('div');
  row.className = 'meta-panel-row';

  const label = document.createElement('span');
  label.textContent = 'valor atual:';
  row.appendChild(label);

  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '0.01';
  input.value = task.meta.atual;
  row.appendChild(input);

  const metaLabel = document.createElement('span');
  metaLabel.textContent = '/ meta: ' + task.meta.alvo.toLocaleString('pt-BR');
  row.appendChild(metaLabel);

  const salvarBtn = document.createElement('button');
  salvarBtn.textContent = 'salvar';
  salvarBtn.onclick = () => atualizarMeta(task.id, input.value);
  row.appendChild(salvarBtn);

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') atualizarMeta(task.id, input.value);
  });

  panel.appendChild(row);

  if(metaAtingida(task)){
    const okMsg = document.createElement('div');
    okMsg.className = 'period-label';
    okMsg.style.marginTop = '8px';
    okMsg.textContent = '✓ meta batida — já dá pra marcar a tarefa como concluída';
    panel.appendChild(okMsg);
  }

  return panel;
}

// Painel de mini-passos (aparece só quando a tarefa está expandida).
// É uma <li> separada, de bloco inteiro, em vez de ficar espremida na
// linha de flex da tarefa.
function buildSubtaskPanel(task){
  const panel = document.createElement('li');
  panel.className = 'subtask-panel';
  panel.onclick = (e) => e.stopPropagation(); // clicar aqui dentro não deve fechar o painel

  if(!task.subtasks) task.subtasks = [];

  if(task.subtasks.length === 0){
    // Ainda não existe nenhum passo: este é o momento de "criação" do
    // pipeline, e é a ÚNICA vez que essa escolha aparece. Depois que o
    // primeiro passo for adicionado, esse controle some — o valor fica
    // fixo (só dá pra mudar apagando os passos e recomeçando do zero).
    const seqRow = document.createElement('label');
    seqRow.className = 'seq-toggle';
    const seqCheckbox = document.createElement('input');
    seqCheckbox.type = 'checkbox';
    seqCheckbox.checked = !!task.sequential;
    seqCheckbox.onchange = () => toggleSequential(task.id);
    seqRow.appendChild(seqCheckbox);
    seqRow.appendChild(document.createTextNode(' ordem sequencial (só deixa marcar o próximo passo) — escolha antes de adicionar o 1º passo'));
    panel.appendChild(seqRow);
  } else {
    task.subtasks.forEach((sub, i) => {
      const bloqueado = task.sequential && !sub.done && task.subtasks.slice(0, i).some(s => !s.done);

      const row = document.createElement('div');
      row.className = 'subtask-row' + (bloqueado ? ' locked' : '');

      const cb = document.createElement('div');
      cb.className = 'sub-check' + (sub.done ? ' done' : '');
      cb.textContent = sub.done ? '✓' : '';
      if(!bloqueado){
        cb.onclick = () => toggleSubtask(task.id, sub.id);
      }

      const label = document.createElement('span');
      label.className = 'sub-text' + (sub.done ? ' done' : '');
      label.textContent = sub.text;

      const delSub = document.createElement('button');
      delSub.className = 'del';
      delSub.textContent = 'x';
      delSub.onclick = () => deleteSubtask(task.id, sub.id);

      row.appendChild(cb);
      row.appendChild(label);
      row.appendChild(delSub);
      panel.appendChild(row);
    });
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-subtask-row';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Novo passo...';
  input.maxLength = 80;
  const addBtn = document.createElement('button');
  addBtn.textContent = '+';
  const submeter = () => {
    addSubtask(task.id, input.value);
    input.value = '';
  };
  addBtn.onclick = submeter;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') submeter(); });
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  panel.appendChild(addRow);

  return panel;
}

// ---------- Persistência via Firestore ----------
// ANTES: um documento único "usuarios/<uid>" guardava um campo "tasks"
// com o array INTEIRO. Toda alteração reenviava tudo, e se alguma aba
// tivesse uma cópia desatualizada na memória (ex: aba em segundo plano
// por muito tempo), ela podia sobrescrever o array inteiro com dados
// velhos, apagando mudanças novas de qualquer outro dispositivo.
//
// AGORA: cada tarefa é o SEU PRÓPRIO documento, dentro de
// "usuarios/<uid>/tarefas/<idDaTarefa>". Uma escrita só mexe no
// documento daquela tarefa específica — uma aba desatualizada, na
// pior das hipóteses, só estraga a tarefa que ela mesma tocou por
// último, nunca mais a lista inteira.
// O documento "usuarios/<uid>" agora guarda só o campo "mode".

function tarefasColRef(){
  return collection(db, 'usuarios', currentUser.uid, 'tarefas');
}

function usuarioDocRef(){
  return doc(db, 'usuarios', currentUser.uid);
}

async function salvarTarefa(task){
  if(!currentUser || isApplyingRemoteData) return;
  try{
    document.getElementById('syncStatus').textContent = 'salvando...';
    await setDoc(doc(tarefasColRef(), task.id), task);
  }catch(e){
    console.error('Falha ao salvar tarefa', e);
    document.getElementById('syncStatus').textContent = 'erro ao salvar';
  }
}

async function apagarTarefaDoc(taskId){
  if(!currentUser) return;
  try{
    await deleteDoc(doc(tarefasColRef(), taskId));
  }catch(e){
    console.error('Falha ao apagar tarefa', e);
  }
}

// Salva várias tarefas de uma vez (e apaga outras) numa única operação
// atômica — usado pelas rotinas de manutenção (atrasadas, reset de
// pipeline/meta, limpeza de únicas), que podem mexer em mais de uma
// tarefa ao mesmo tempo.
async function salvarVariasTarefas(tarefasParaSalvar, idsParaApagar){
  if(!currentUser) return;
  if(tarefasParaSalvar.length === 0 && idsParaApagar.length === 0) return;
  try{
    document.getElementById('syncStatus').textContent = 'salvando...';
    const batch = writeBatch(db);
    tarefasParaSalvar.forEach(t => batch.set(doc(tarefasColRef(), t.id), t));
    idsParaApagar.forEach(id => batch.delete(doc(tarefasColRef(), id)));
    await batch.commit();
  }catch(e){
    console.error('Falha ao salvar em lote', e);
    document.getElementById('syncStatus').textContent = 'erro ao salvar';
  }
}

async function salvarModo(){
  if(!currentUser || isApplyingRemoteData) return;
  try{
    await setDoc(usuarioDocRef(), { mode: currentMode }, { merge: true });
  }catch(e){
    console.error('Falha ao salvar modo', e);
  }
}

// Migração de contas antigas: se o documento do usuário ainda tiver
// aquele campo "tasks" (array inteiro, do jeito antigo), transforma
// cada item dele num documento separado na nova coleção, uma única vez.
// É seguro rodar isso de novo por engano — usa o mesmo id de sempre,
// então só sobrescreve com o mesmo conteúdo, nunca duplica.
async function migrarDadosAntigosSeNecessario(){
  const refUsuario = usuarioDocRef();
  const snap = await getDoc(refUsuario);
  const data = snap.data();
  if(!data || !Array.isArray(data.tasks) || data.tasks.length === 0) return;

  const batch = writeBatch(db);
  data.tasks.forEach((t, i) => {
    const id = t.id || ('t' + Date.now() + i);
    const tarefaComOrdem = { ...t, id, ordem: (t.ordem != null ? t.ordem : i) };
    batch.set(doc(tarefasColRef(), id), tarefaComOrdem);
  });
  // sobrescreve o documento do usuário SEM o campo "tasks" antigo — a partir
  // de agora ele só guarda o modo, as tarefas vivem todas na subcoleção
  batch.set(refUsuario, { mode: data.mode || 'ambos' });
  await batch.commit();
}

let pendingWritesModo = false;
let pendingWritesTarefas = false;
let pendingWrites = false;

function atualizarStatusSincronizacao(){
  pendingWrites = pendingWritesModo || pendingWritesTarefas;
  document.getElementById('syncStatus').textContent = pendingWrites ? 'salvando...' : 'sincronizado';
}

function comecarAEscutarDados(){
  unsubscribeModo = onSnapshot(usuarioDocRef(), { includeMetadataChanges: true }, (snap) => {
    pendingWritesModo = snap.metadata.hasPendingWrites;
    const data = snap.data();
    currentMode = (data && data.mode) || 'ambos';
    atualizarStatusSincronizacao();
    render();
  }, (err) => {
    console.error('Erro ao escutar modo', err);
    document.getElementById('syncStatus').textContent = 'sem conexão';
  });

  unsubscribeTarefas = onSnapshot(tarefasColRef(), { includeMetadataChanges: true }, (snap) => {
    pendingWritesTarefas = snap.metadata.hasPendingWrites;

    isApplyingRemoteData = true;
    tasks = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    tasks.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

    document.getElementById('loadingMsg').style.display = 'none';
    atualizarStatusSincronizacao();

    const tarefasComAtraso = checkMissedTasks();
    const idsParaApagar = cleanupOnceTasks();
    const tarefasComPipelineResetado = resetExpiredPipelines();

    render();
    isApplyingRemoteData = false;

    // junta as duas listas de "tarefas alteradas pela manutenção" sem duplicar,
    // caso a mesma tarefa apareça em ambas
    const mapaTarefasAlteradas = new Map();
    tarefasComAtraso.forEach(t => mapaTarefasAlteradas.set(t.id, t));
    tarefasComPipelineResetado.forEach(t => mapaTarefasAlteradas.set(t.id, t));
    salvarVariasTarefas(Array.from(mapaTarefasAlteradas.values()), idsParaApagar);
  }, (err) => {
    console.error('Erro ao escutar tarefas', err);
    document.getElementById('syncStatus').textContent = 'sem conexão';
  });
}

// Se você tentar fechar/recarregar a aba enquanto ainda existe alteração
// não confirmada pelo servidor, o navegador mostra um aviso de confirmação.
window.addEventListener('beforeunload', (e) => {
  if(pendingWrites){
    e.preventDefault();
    e.returnValue = '';
  }
});

function pararDeEscutar(){
  if(unsubscribeModo){ unsubscribeModo(); unsubscribeModo = null; }
  if(unsubscribeTarefas){ unsubscribeTarefas(); unsubscribeTarefas = null; }
}

function toggleTask(id){
  const task = tasks.find(t => t.id === id);
  if(!task) return;
  const done = isDone(task);
  task.doneKey = done ? null : currentKey(task.freq);
  if(isDone(task)) task.missed = false; // "até o próximo check": chegou, limpa o atraso
  render();
  salvarTarefa(task);
}

function deleteTask(id){
  tasks = tasks.filter(t => t.id !== id);
  render();
  apagarTarefaDoc(id);
}

// ---------- Mini-passos (pipeline) dentro de uma tarefa ----------

function addSubtask(taskId, text){
  const t = text.trim();
  if(!t) return;
  const task = tasks.find(x => x.id === taskId);
  if(!task) return;
  if(!task.subtasks) task.subtasks = [];
  task.subtasks.push({
    id: 's' + Date.now() + Math.random().toString(36).slice(2,6),
    text: t,
    done: false
  });
  task.cycleKey = currentKey(task.freq); // marca a que período este progresso pertence
  render();
  salvarTarefa(task);
}

function deleteSubtask(taskId, subId){
  const task = tasks.find(x => x.id === taskId);
  if(!task || !task.subtasks) return;
  task.subtasks = task.subtasks.filter(s => s.id !== subId);
  // recalcula se a tarefa mãe deve ficar marcada como concluída
  const todosFeitos = task.subtasks.length > 0 && task.subtasks.every(s => s.done);
  task.doneKey = todosFeitos ? currentKey(task.freq) : null;
  if(isDone(task)) task.missed = false;
  render();
  salvarTarefa(task);
}

function toggleSubtask(taskId, subId){
  const task = tasks.find(x => x.id === taskId);
  if(!task || !task.subtasks) return;
  const idx = task.subtasks.findIndex(s => s.id === subId);
  if(idx === -1) return;
  const sub = task.subtasks[idx];

  if(task.sequential && !sub.done){
    // no modo sequencial, só deixa marcar se todos os passos anteriores já estiverem feitos
    const temPendenteAntes = task.subtasks.slice(0, idx).some(s => !s.done);
    if(temPendenteAntes) return;
  }

  if(task.sequential && sub.done){
    // desmarcando um passo no modo sequencial: desmarca também os que vêm depois,
    // pra não deixar um passo "concluído" com um anterior pendente
    for(let i = idx; i < task.subtasks.length; i++) task.subtasks[i].done = false;
  } else {
    sub.done = !sub.done;
  }

  task.cycleKey = currentKey(task.freq);
  const todosFeitos = task.subtasks.every(s => s.done);
  task.doneKey = todosFeitos ? currentKey(task.freq) : null;
  if(isDone(task)) task.missed = false;

  render();
  salvarTarefa(task);
}

function toggleSequential(taskId){
  const task = tasks.find(x => x.id === taskId);
  if(!task) return;
  task.sequential = !task.sequential;
  render();
  salvarTarefa(task);
}

// Troca a tarefa de posição dentro do grupo em que ela está sendo exibida
// no momento — usa getGroupsToRender() pra "ver" exatamente a mesma lista
// que está na tela, seja agrupado por Frequência ou por Pasta.
// Como cada tarefa agora é um documento separado, a ordem entre elas
// precisa ser um CAMPO salvo (não dá mais pra confiar só na posição
// dentro do array) — por isso aqui a gente troca o campo "ordem" das
// duas tarefas envolvidas.
function moveTask(id, dir){
  const grupos = getGroupsToRender();
  const grupoDaTarefa = grupos.find(g => g.tasksInGroup.some(t => t.id === id));
  if(!grupoDaTarefa) return;

  const visivelNoGrupo = grupoDaTarefa.tasksInGroup;
  const pos = visivelNoGrupo.findIndex(t => t.id === id);
  const novaPos = pos + dir;
  if(novaPos < 0 || novaPos >= visivelNoGrupo.length) return;

  const tarefaA = visivelNoGrupo[pos];
  const tarefaB = visivelNoGrupo[novaPos];
  const ordemA = tarefaA.ordem || 0;
  const ordemB = tarefaB.ordem || 0;
  tarefaA.ordem = ordemB;
  tarefaB.ordem = ordemA;

  // também troca a posição no array local, pra tela atualizar na hora,
  // sem esperar o Firestore confirmar e mandar de volta
  const i1 = tasks.findIndex(t => t.id === tarefaA.id);
  const i2 = tasks.findIndex(t => t.id === tarefaB.id);
  [tasks[i1], tasks[i2]] = [tasks[i2], tasks[i1]];

  render();
  salvarVariasTarefas([tarefaA, tarefaB], []);
}

function addTask(){
  const input = document.getElementById('newTaskText');
  const catInput = document.getElementById('newTaskCategory');
  const pastaInput = document.getElementById('newTaskPasta');
  const regimeInput = document.getElementById('newTaskRegime');
  const temMetaInput = document.getElementById('newTaskTemMeta');
  const metaAlvoInput = document.getElementById('newTaskMetaAlvo');
  const text = input.value.trim();
  if(!text) return;
  const category = catInput.value.trim() || 'Geral';
  const pasta = pastaInput.value.trim() || null; // pasta é opcional, sem valor padrão "Geral"
  // regime só é considerado quando a categoria é "Trabalho" — mesma regra
  // que decide se o seletor aparece na tela, pra não salvar um valor que
  // ficou escondido/esquecido de uma digitação anterior
  const regime = (category.toLowerCase() === 'trabalho' && regimeInput.value) ? regimeInput.value : null;
  const alvoDigitado = Number(metaAlvoInput.value);
  const meta = (temMetaInput.checked && alvoDigitado > 0) ? { alvo: alvoDigitado, atual: 0 } : null;
  // dias ativos só faz sentido pra tarefas diárias; null = "todo dia" (padrão)
  const diasAtivos = (selectedFreq === 'daily' && diasSelecionados.size < 7)
    ? Array.from(diasSelecionados).sort()
    : null;
  // nova tarefa entra no fim da lista — maior "ordem" existente + 1
  const maiorOrdem = tasks.reduce((max, t) => Math.max(max, t.ordem || 0), 0);
  const novaTarefa = {
    id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
    text: text,
    category: category,
    pasta: pasta,
    regime: regime,
    meta: meta,
    diasAtivos: diasAtivos,
    freq: selectedFreq,
    doneKey: null,
    ordem: maiorOrdem + 1
  };
  tasks.push(novaTarefa);
  input.value = '';
  catInput.value = '';
  pastaInput.value = '';
  regimeInput.value = '';
  temMetaInput.checked = false;
  metaAlvoInput.value = '';
  resetarDiaPicker();
  atualizarVisibilidadeMeta();
  atualizarVisibilidadeRegime();
  render();
  salvarTarefa(novaTarefa);
}

document.getElementById('addBtn').onclick = addTask;

// O Regime (meio período/integral) só faz sentido pra tarefas de "Trabalho",
// então ele fica escondido até a pessoa digitar essa categoria.
const categoryInputEl = document.getElementById('newTaskCategory');
const regimeSelectEl = document.getElementById('newTaskRegime');
function atualizarVisibilidadeRegime(){
  const ehTrabalho = categoryInputEl.value.trim().toLowerCase() === 'trabalho';
  regimeSelectEl.classList.toggle('hidden', !ehTrabalho);
  if(!ehTrabalho) regimeSelectEl.value = ''; // some a categoria, some junto o valor escolhido
}
categoryInputEl.addEventListener('input', atualizarVisibilidadeRegime);

// O campo de "valor alvo" da meta só aparece quando o checkbox "tem meta?"
// está marcado — antes disso ele fica escondido, fora do caminho.
const temMetaCheckboxEl = document.getElementById('newTaskTemMeta');
const metaAlvoInputEl = document.getElementById('newTaskMetaAlvo');
function atualizarVisibilidadeMeta(){
  metaAlvoInputEl.classList.toggle('hidden', !temMetaCheckboxEl.checked);
  if(!temMetaCheckboxEl.checked) metaAlvoInputEl.value = '';
}
temMetaCheckboxEl.addEventListener('change', atualizarVisibilidadeMeta);

document.getElementById('newTaskText').addEventListener('keydown', e => {
  if(e.key === 'Enter') addTask();
});
document.getElementById('freqPicker').addEventListener('click', e => {
  const btn = e.target.closest('.freq-btn');
  if(!btn) return;
  selectedFreq = btn.dataset.freq;
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('dayPicker').classList.toggle('hidden', selectedFreq !== 'daily');
});

document.getElementById('dayPicker').addEventListener('click', e => {
  const btn = e.target.closest('.day-btn');
  if(!btn) return;
  const dia = Number(btn.dataset.day);
  if(diasSelecionados.has(dia)){
    diasSelecionados.delete(dia);
    btn.classList.remove('active');
  } else {
    diasSelecionados.add(dia);
    btn.classList.add('active');
  }
});

function resetarDiaPicker(){
  diasSelecionados = new Set([0,1,2,3,4,5,6]);
  document.querySelectorAll('#dayPicker .day-btn').forEach(b => b.classList.add('active'));
}
document.getElementById('modeBar').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if(!btn) return;
  currentMode = btn.dataset.mode;
  render();
  salvarModo();
});

document.getElementById('viewBar').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if(!btn) return;
  viewMode = btn.dataset.view;
  render(); // isso é só visual — não precisa salvar no Firestore
});

document.getElementById('metaBar').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if(!btn) return;
  showBlocked = btn.dataset.showblocked === 'true';
  render(); // isso também é só visual, local a este dispositivo
});

setInterval(() => {
  renderTodayLabel();
  const tarefasComAtraso = checkMissedTasks();
  const idsParaApagar = cleanupOnceTasks();
  const tarefasComPipelineResetado = resetExpiredPipelines();
  render();

  const mapaTarefasAlteradas = new Map();
  tarefasComAtraso.forEach(t => mapaTarefasAlteradas.set(t.id, t));
  tarefasComPipelineResetado.forEach(t => mapaTarefasAlteradas.set(t.id, t));
  salvarVariasTarefas(Array.from(mapaTarefasAlteradas.values()), idsParaApagar);
}, 5 * 60 * 1000);

// ---------- Login / Autenticação ----------
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginError = document.getElementById('loginError');

function mostrarErro(e){
  const codigo = e.code || '';
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/missing-password': 'Digite uma senha.',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Tente entrar em vez de criar conta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.'
  };
  loginError.textContent = mapa[codigo] || ('Erro: ' + (e.message || 'algo deu errado'));
}

document.getElementById('btnEntrar').onclick = async () => {
  loginError.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  try{
    await signInWithEmailAndPassword(auth, email, senha);
  }catch(e){ mostrarErro(e); }
};

document.getElementById('btnCriarConta').onclick = async () => {
  loginError.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  try{
    await createUserWithEmailAndPassword(auth, email, senha);
  }catch(e){ mostrarErro(e); }
};

document.getElementById('btnSair').onclick = async () => {
  pararDeEscutar();
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if(user){
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    document.getElementById('accountEmail').textContent = user.email;
    renderTodayLabel();
    try{
      await migrarDadosAntigosSeNecessario();
    }catch(e){
      console.error('Falha ao migrar dados antigos', e);
    }
    comecarAEscutarDados();
  } else {
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    pararDeEscutar();
    tasks = [];
  }
});
